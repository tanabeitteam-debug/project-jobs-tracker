<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Project &amp; Jobs Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: dark sidebar on the left (menu, quick views, account), full-width content on the right:
   dashboard, kanban board with a detail panel, project cards. Status colors are semantic
   (todo / doing / review / done / late) and always paired with a text label. */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --surface-2:#EDF0F6;
  --ink:#121A2B; --ink-2:#434D66; --ink-3:#5B6681; --line:#DCE1EB;
  --accent:#2457D6; --accent-ink:#FFFFFF; --accent-soft:#E3EBFC;
  --todo:#5B6681; --todo-bg:#E9ECF3; --todo-bar:#8E99B3;
  --doing:#2457D6; --doing-bg:#E3EBFC; --doing-bar:#2457D6;
  --review:#8A5200; --review-bg:#FFEFD0; --review-bar:#E39A1B;
  --done:#0F6B3E; --done-bg:#DAF1E5; --done-bar:#23A064;
  --bad:#B42323; --bad-bg:#FDE3E3; --bad-bar:#D84343; --bad-solid:#C23030;
  --c-open:#2457D6; --c-done:#23A064;
  --shadow:0 1px 2px rgba(18,26,43,.06),0 4px 16px rgba(18,26,43,.05);
  --font-display:'Prompt','IBM Plex Sans Thai',system-ui,'Leelawadee UI',Tahoma,sans-serif;
  --font-body:'IBM Plex Sans Thai','Noto Sans Thai','Leelawadee UI',system-ui,Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1422; --surface:#161E31; --surface-2:#1D2740;
    --ink:#E8ECF6; --ink-2:#B0BAD2; --ink-3:#8F9AB5; --line:#28324C;
    --accent:#6C97FF; --accent-ink:#0E1422; --accent-soft:#1F2D52;
    --todo:#A3AEC8; --todo-bg:#232C44; --todo-bar:#6B7694;
    --doing:#7FA3FF; --doing-bg:#1F2D52; --doing-bar:#6C97FF;
    --review:#F0B04A; --review-bg:#3A2D14; --review-bar:#E39A1B;
    --done:#4BC98A; --done-bg:#12352A; --done-bar:#2FB473;
    --bad:#FF8080; --bad-bg:#3E1A1E; --bad-bar:#E65C5C; --bad-solid:#C23030;
    --c-open:#5B87F0; --c-done:#2AA366;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1422; --surface:#161E31; --surface-2:#1D2740;
  --ink:#E8ECF6; --ink-2:#B0BAD2; --ink-3:#8F9AB5; --line:#28324C;
  --accent:#6C97FF; --accent-ink:#0E1422; --accent-soft:#1F2D52;
  --todo:#A3AEC8; --todo-bg:#232C44; --todo-bar:#6B7694;
  --doing:#7FA3FF; --doing-bg:#1F2D52; --doing-bar:#6C97FF;
  --review:#F0B04A; --review-bg:#3A2D14; --review-bar:#E39A1B;
  --done:#4BC98A; --done-bg:#12352A; --done-bar:#2FB473;
  --bad:#FF8080; --bad-bg:#3E1A1E; --bad-bar:#E65C5C; --bad-solid:#C23030;
    --c-open:#5B87F0; --c-done:#2AA366;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--font-body);-webkit-text-size-adjust:100%}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.3;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.muted{color:var(--ink-3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* buttons and controls */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;font-weight:500;min-height:38px;line-height:1.2}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad-solid);border-color:var(--bad-solid);color:#fff}
.btn[disabled]{opacity:.6;cursor:default}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:transparent;display:inline-grid;place-items:center;color:var(--ink-3)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.del:hover{color:var(--bad)}
input[type=text],input[type=search],input[type=date],input[type=password],select.f,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 12px;min-height:40px}
textarea{resize:vertical;min-height:72px}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap}
.pill::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.todo,.selwrap.todo select{color:var(--todo);background:var(--todo-bg)}
.pill.doing,.selwrap.doing select{color:var(--doing);background:var(--doing-bg)}
.pill.review,.selwrap.review select{color:var(--review);background:var(--review-bg)}
.pill.done,.selwrap.done select{color:var(--done);background:var(--done-bg)}
.selwrap{position:relative;display:inline-block}
.selwrap.todo{color:var(--todo)}.selwrap.doing{color:var(--doing)}.selwrap.review{color:var(--review)}.selwrap.done{color:var(--done)}
.selwrap select{appearance:none;-webkit-appearance:none;border:0;border-radius:999px;padding:4px 30px 4px 12px;font-size:13px;font-weight:500;min-height:30px;cursor:pointer}
.selwrap select option{color:var(--ink);background:var(--surface)}
.selwrap::after{content:'';position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.chip{display:inline-block;padding:0 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);font-size:13px;font-weight:500}

/* urgency */
.u-late{--bar:var(--bad-bar)}.u-soon{--bar:var(--review-bar)}.u-week{--bar:var(--accent)}.u-ok{--bar:var(--todo-bar)}.u-done{--bar:var(--done-bar)}
.dot.u-late{background:var(--bad-bar)}.dot.u-soon{background:var(--review-bar)}.dot.u-week{background:var(--accent)}.dot.u-ok{background:var(--todo-bar)}.dot.u-done{background:var(--done-bar)}
.due{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.u-late .due{color:var(--bad);font-weight:600}
.u-soon .due{color:var(--review);font-weight:600}
.u-done .due{color:var(--done)}

/* dashboard */
.alert{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bad-bg);color:var(--bad);border-left:4px solid var(--bad-bar);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-weight:500}
.alert .btn{margin-left:auto;min-height:32px;padding:4px 12px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.tile{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 14px 22px;box-shadow:var(--shadow);width:100%}
.tile::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.tile:hover{background:var(--surface-2)}
.tile-num{font-family:var(--font-display);font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.tile-label{font-size:14px;color:var(--ink-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.card-h h2{font-size:16px}
.prog{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.prog>span{display:block;height:100%;background:var(--done-bar);border-radius:99px;min-width:0}
.prog-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px;font-variant-numeric:tabular-nums}
.dash{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
.stack{display:grid;gap:8px}
.mini{display:flex;gap:12px;align-items:center;justify-content:space-between;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bar);border-radius:10px;padding:10px 12px}
.mini:hover{background:var(--surface-2)}
.mini-t{min-width:0}
.mini-t b{display:block;font-weight:500;overflow-wrap:anywhere}
.mini-t span{font-size:13px;color:var(--ink-3)}
.empty{padding:20px 8px;text-align:center;color:var(--ink-3)}
.empty .btn{margin-top:10px}

/* add chooser */
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.type-card{display:flex;align-items:center;justify-content:center;min-height:76px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font:inherit;color:inherit;cursor:pointer}
.type-card:hover{background:var(--surface-2);border-color:var(--accent)}
.type-card.urgent{border-left:4px solid var(--bad-bar)}
.type-card.urgent:hover{border-color:var(--bad-bar)}
.type-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.type-card b{font-family:var(--font-display);font-size:18px;font-weight:600}
.opt{font-weight:400;color:var(--ink-3)}
.urg{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.5;color:var(--bad);background:var(--bad-bg);vertical-align:2px;white-space:nowrap}
.alert.warn{background:var(--review-bg);color:var(--review);border-left-color:var(--review-bar)}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg-o input[value="ด่วน"]:checked+span{background:var(--bad-solid);border-color:var(--bad-solid);color:#fff}

/* charts */
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.chart-sub{font-size:13px;color:var(--ink-3);margin:-6px 0 14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2);margin-bottom:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hbars{display:grid;gap:4px}
.hrow{display:grid;grid-template-columns:minmax(64px,30%) minmax(0,1fr) 3ch;gap:10px;align-items:center;font-size:14px;padding:5px 6px;margin:0 -6px;border-radius:8px}
.hrow:hover,.hrow:focus-visible,.col:hover,.col:focus-visible{background:var(--surface-2)}
.hrow .nm{color:var(--ink-2);overflow-wrap:anywhere;line-height:1.25}
.hrow .val{font-variant-numeric:tabular-nums;text-align:right;color:var(--ink)}
.htrack{display:block;height:14px}
.hfill{display:flex;height:100%;min-width:0}
.hseg{display:block;height:100%;min-width:4px}
.hseg+.hseg{margin-left:2px}
.hseg:last-child{border-radius:0 4px 4px 0}
.cols{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;height:150px;border-bottom:1px solid var(--line)}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border-radius:8px 8px 0 0;min-width:0}
.col-v{font-size:13px;font-variant-numeric:tabular-nums;margin-bottom:4px;color:var(--ink)}
.col-v.zero{color:var(--ink-3)}
.col-bar{display:block;width:62%;max-width:36px;border-radius:4px 4px 0 0}
.xlabs{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-top:6px;text-align:center;font-size:12px;line-height:1.25;color:var(--ink-3)}
.xlabs .x-late{color:var(--bad)}
.prow{display:grid;gap:5px;padding:5px 6px;margin:0 -6px;border-radius:8px}
.prow:hover,.prow:focus-visible{background:var(--surface-2)}
.prow-h{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.prow-h .nm{color:var(--ink-2);overflow-wrap:anywhere}
.prow-h .val{font-variant-numeric:tabular-nums;white-space:nowrap}
.prow .prog>span{background:var(--c-done)}
.chart-empty{padding:28px 8px;text-align:center;color:var(--ink-3);font-size:14px}
.chart-foot{margin-top:10px;font-size:13px;color:var(--ink-3)}
#tip{position:fixed;z-index:80;max-width:260px;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:13px;line-height:1.35;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#tip[hidden]{display:none}

/* calendar */
.cal-nav{display:flex;align-items:center;gap:4px}
.cal-title{font-family:var(--font-display);font-weight:600;min-width:130px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dow{text-align:center;font-size:12px;color:var(--ink-3);padding:4px 0}
.day{aspect-ratio:1/.85;border:1px solid transparent;background:transparent;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums;padding:0}
.day:hover{background:var(--surface-2)}
.day.today{border-color:var(--accent)}
.day.sel{background:var(--accent);color:var(--accent-ink)}
.dots{display:flex;gap:3px;height:6px}
.dot{width:6px;height:6px;border-radius:50%;display:block}
.day.sel .dot{background:var(--accent-ink)}
.day-list{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.day-list h3{font-size:14px;margin-bottom:8px;color:var(--ink-2);font-family:var(--font-body);font-weight:600}

/* jobs */
.toolbar{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(auto-fit,minmax(0,1fr));gap:10px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:14px;font-weight:500;color:var(--ink-2);display:inline-flex;gap:8px;align-items:center}
.fchip:hover{background:var(--surface-2)}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fchip .n{font-variant-numeric:tabular-nums;opacity:.85}
.job{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 20px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bar);border-radius:12px;padding:12px 14px 12px 16px;box-shadow:var(--shadow)}
.job-title{font-size:16px;overflow-wrap:anywhere}
.job-proj{font-size:13px;color:var(--ink-3);margin-bottom:6px;overflow-wrap:anywhere}
.job-meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;align-items:center}
.job-meta .k{font-size:12px;color:var(--ink-3);margin-right:2px}
.job-note{margin-top:8px;font-size:14px;color:var(--ink-2);overflow-wrap:anywhere;white-space:pre-wrap}
.job-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.job-actions{display:flex;gap:2px}
.diff{display:inline-flex;align-items:center;gap:3px}
.diff i{width:6px;height:14px;border-radius:2px;background:var(--line)}
.diff i.on{background:var(--ink-2)}
.diff span{margin-left:5px;font-size:13px;color:var(--ink-2)}
.list{display:grid;gap:10px}

/* projects */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.proj h2{font-size:17px;overflow-wrap:anywhere}
.proj .note{font-size:14px;color:var(--ink-3);margin-top:2px;overflow-wrap:anywhere}
.proj .prog{margin:12px 0 6px}
.proj-stats{font-size:13px;color:var(--ink-2);margin-bottom:12px;font-variant-numeric:tabular-nums}
.proj-jobs{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px}
.proj-jobs li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--surface-2);font-size:14px}
.proj-jobs li b{font-weight:500;overflow-wrap:anywhere}
.proj-jobs .r{display:flex;gap:10px;align-items:center;flex:none}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,16,30,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(580px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.panel h2{font-size:19px;margin-bottom:16px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>label,.lbl{font-weight:500;font-size:14px}
.req{color:var(--bad)}
.hint{font-size:12px;color:var(--ink-3)}
.err{font-size:13px;color:var(--bad);min-height:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg-o{position:relative;display:block}
.seg-o input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg-o span{display:block;text-align:center;padding:8px 4px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-weight:500;background:var(--surface)}
.seg-o input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg-o input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

.ulist{display:grid;gap:10px}
.urow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.urow.off{opacity:.65}
.urow .avatar{width:40px;height:40px}
.urow b{font-weight:600;overflow-wrap:anywhere}
.urow .un{font-size:13px;color:var(--ink-3);overflow-wrap:anywhere}
.urow .meta{font-size:13px;color:var(--ink-2);margin-top:2px;font-variant-numeric:tabular-nums}
.role{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.5;background:var(--accent-soft);color:var(--accent);vertical-align:1px;white-space:nowrap}
.role.off{background:var(--surface-2);color:var(--ink-3)}
.note-card{margin-bottom:14px;font-size:14px;color:var(--ink-2)}
.stamp{font-size:12px;color:var(--ink-3);margin:-2px 0 12px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:18px;height:18px;margin:0}
.acct{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.acct .avatar{width:44px;height:44px}
.sep{border:0;border-top:1px solid var(--line);margin:14px 0}
.ro{background:var(--surface-2)!important;color:var(--ink-2)}
.lock{max-width:380px;margin:48px auto}
.lock.wide{max-width:440px}
.lock h1{font-size:20px;margin-bottom:4px}
.lock .sub{color:var(--ink-3);font-size:14px;margin-bottom:16px}
.is-locked .user{display:none}

@media (max-width:860px){
  .dash{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:860px){
  .charts{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .types{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .toolbar{grid-template-columns:1fr}
  .job{grid-template-columns:1fr}
  .job-side{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- dashboard v2: big numbers, one to-do list, fewer charts ---- */
.tiles.hero{grid-template-columns:1.7fr repeat(3,minmax(0,1fr))}
.tile.big{padding:16px 18px 16px 24px}
.tile.big .tile-num{font-size:46px}
.tiles.hero .tile:not(.big){display:flex;flex-direction:column;justify-content:center}
.tile-sub{font-size:13px;color:var(--ink-3);margin-top:8px;font-variant-numeric:tabular-nums}
.tile .prog{margin-top:10px}
.tile.is-alert .tile-num{color:var(--bad)}
.tile.is-warn .tile-num{color:var(--review)}
.todos{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bar);border-radius:10px;padding:8px 12px 8px 10px}
.tick{width:28px;height:28px;flex:none;border-radius:8px;border:2px solid var(--ink-3);background:var(--surface);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.tick:hover{border-color:var(--done-bar);background:var(--done-bg)}
.trow.is-done .tick{background:var(--done-bar);border-color:var(--done-bar)}
.todo-main{text-align:left;background:none;border:0;padding:2px 0;min-width:0;font:inherit;color:inherit;cursor:pointer;border-radius:6px}
.todo-main:hover .todo-t{text-decoration:underline}
.todo-t{display:block;font-weight:500;overflow-wrap:anywhere}
.todo-s{display:block;font-size:13px;color:var(--ink-3)}
.todo-due{display:grid;text-align:right;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.todo-due .cd{font-weight:600;color:var(--ink-2)}
.trow.u-late .cd{color:var(--bad)}
.trow.u-soon .cd{color:var(--review)}
.trow.is-done{opacity:.8}
.trow.is-done .todo-t{text-decoration:line-through;color:var(--ink-3)}
.linkbtn{background:none;border:0;padding:8px 2px 0;font:inherit;font-size:14px;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.card-note{font-size:13px;color:var(--ink-3);margin:8px 0 0}
.charts.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1000px){.charts.c3{grid-template-columns:repeat(2,minmax(0,1fr))}.charts.c3>:first-child{grid-column:1/-1}}
@media (max-width:640px){.charts.c3{grid-template-columns:minmax(0,1fr)}}
#toast.show.act{pointer-events:auto}
#toast .undo{margin-left:14px;background:none;border:0;padding:0;font:inherit;font-weight:600;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
@media (max-width:640px){
  .tiles.hero{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tile.big{grid-column:1/-1}
  .trow{grid-template-columns:auto minmax(0,1fr)}
  .todo-due{grid-column:2;display:flex;gap:10px;text-align:left}
}
/* app shell: dark sidebar on the left, content uses the full width on the right */
:root{--side-bg:#0F1C3F;--side-ink:#D5DDF3;--side-ink-2:#A9B6D8;--side-ink-3:#8FA1D0;--side-hover:rgba(255,255,255,.09);--side-w:248px;
  --av0:#175CD3;--av1:#067647;--av2:#B54708;--av3:#5925DC;--av4:#C11574;--av5:#0E7090}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--side-bg:#0A1020;--av0:#8FB1FF;--av1:#6CE9A6;--av2:#FDB022;--av3:#B692F6;--av4:#F670C7;--av5:#67E3F9}}
:root[data-theme="dark"]{--side-bg:#0A1020;--av0:#8FB1FF;--av1:#6CE9A6;--av2:#FDB022;--av3:#B692F6;--av4:#F670C7;--av5:#67E3F9}

.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh;align-items:start}
.content{min-width:0}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side-bg);color:var(--side-ink);padding:22px 14px 16px;display:flex;flex-direction:column;gap:24px;z-index:20}
.side :focus-visible{outline-color:#9DB8FF}
.brand{display:flex;gap:12px;align-items:center;min-width:0;padding:0 6px}
.mark{width:40px;height:40px;border-radius:11px;background:#2457D6;color:#fff;display:grid;place-items:center;flex:none}
.brand-name{font-family:var(--font-display);font-weight:600;font-size:15px;line-height:1.25;color:var(--ink)}
.brand-sub{font-size:11.5px;line-height:1.35;color:var(--ink-3);margin-top:2px}
.side .brand-name{color:#fff}
.side .brand-sub{color:var(--side-ink-2)}
#nav{display:flex;flex-direction:column;gap:4px}
#nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:var(--side-ink);text-decoration:none;font-weight:500;font-size:15px;white-space:nowrap}
#nav a:hover{background:var(--side-hover)}
#nav a[aria-current="page"]{background:#2457D6;color:#fff}
#nav .nv-t{flex:1}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#D92D20;color:#fff;font-size:12px;font-weight:700;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.quick{display:flex;flex-direction:column;gap:2px}
.quick-h{padding:0 12px 8px;font-size:12px;font-weight:600;color:var(--side-ink-3)}
.qv{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border:0;border-radius:9px;background:transparent;color:var(--side-ink);font-size:14px;text-align:left}
.qv:hover{background:var(--side-hover)}
.qv[aria-current="true"]{background:var(--side-hover);color:#fff;font-weight:600}
.qd{width:9px;height:9px;border-radius:50%;flex:none}
.qv span:first-of-type{flex:1}
.qn{margin-left:auto;color:var(--side-ink-2);font-variant-numeric:tabular-nums}
.side-gap{flex:1}
.user{display:flex;align-items:center;gap:4px;padding:10px;border-radius:12px;background:rgba(255,255,255,.07)}
.user-btn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:2px;border-radius:10px;text-align:left;color:inherit}
.user-btn:hover{background:var(--side-hover)}
.user-txt{min-width:0}
.avatar{width:36px;height:36px;border-radius:50%;background:#D1E9FF;color:#175CD3;display:grid;place-items:center;font-weight:700;font-family:var(--font-display);flex:none}
.user-name{font-size:14px;font-weight:600;line-height:1.25;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:12px;color:var(--side-ink-2)}
.user .icon-btn{width:40px;height:40px;color:var(--side-ink);flex:none}
.user .icon-btn:hover{background:var(--side-hover);color:#fff}
#banner:not(:empty){background:var(--review-bg);color:var(--review);padding:10px 24px;text-align:center;font-size:14px}
.lock-brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{padding:28px 36px 64px}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:14px 24px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:30px;font-weight:700}
.page-head .sub{color:var(--ink-3);font-size:14.5px;margin-top:4px}
.loading{padding:48px 0;text-align:center;color:var(--ink-3)}
.is-locked .app{grid-template-columns:minmax(0,1fr)}
.is-locked .side{display:none}
.is-locked .wrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.is-locked .lock{margin:0;width:100%}

/* bigger, calmer controls and cards */
.btn{min-height:42px;border-radius:11px;padding:0 18px}
.alert .btn{min-height:32px;padding:4px 12px}
input[type=text],input[type=search],input[type=date],input[type=password],select.f,textarea{border-radius:11px;min-height:44px}
textarea{min-height:76px}
.card{border-radius:16px;padding:20px 22px}
.card-h h2{font-size:19px;font-weight:700}

/* dashboard: hero tiles */
.tiles.hero{grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:16px;margin-bottom:0}
.tile{display:flex;flex-direction:column;gap:10px;border-radius:16px;padding:20px 22px;box-shadow:var(--shadow)}
.tile::before{display:none}
.tile>*{display:block}
.tile .tile-h{display:flex;align-items:center;gap:10px}
.tile-ico{width:34px;height:34px;border-radius:10px;display:grid!important;place-items:center;background:var(--ci-bg);color:var(--ci);flex:none}
.tile-label{font-size:14.5px;font-weight:500;color:var(--ink-2)}
.tile-num{font-size:44px;font-weight:700;line-height:1;font-family:var(--font-display)}
.tile.big .tile-num{font-size:56px;letter-spacing:-1px}
.tile.big{padding:20px 22px}
.tile .tile-numrow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.tile-sub{font-size:13.5px;color:var(--ink-3);margin-top:0}
.tile.big .tile-sub{font-size:14.5px;color:var(--ink-2)}
.tile.is-alert .tile-num{color:var(--bad)}
.tile.is-warn .tile-num{color:var(--review)}
.tile.is-info .tile-num{color:var(--doing)}
.stackbar{display:flex!important;gap:3px;height:12px;margin-top:4px}
.stackbar>i{display:block;min-width:4px}
.stackbar>i:first-child{border-radius:6px 0 0 6px}
.stackbar>i:last-child{border-radius:0 6px 6px 0}
.stackbar>i:only-child{border-radius:6px}
.legend2{display:flex!important;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--ink-2)}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.legend2 i{width:10px;height:10px;border-radius:3px;display:inline-block}

.dash{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;margin-top:16px}
.head-tools{display:flex;align-items:flex-start;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.card-sub{font-size:13.5px;color:var(--ink-3);margin-top:2px}
.segs{display:inline-flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:12px}
.segs button{height:36px;padding:0 16px;border:0;border-radius:9px;background:transparent;font-size:14px;font-weight:500;color:var(--ink-2)}
.segs button:hover{color:var(--ink)}
.segs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.16)}
.todos{gap:0;margin-top:8px}
.trow{border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;padding:14px 2px;gap:14px}
.trow:first-child{border-top:0}
.tick{width:30px;height:30px;border-radius:50%}
.todo-t{font-size:15.5px}
.todo-due .cd{font-size:14px}
.trow.u-late .cd{color:var(--bad)}
.card-note{margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.day{aspect-ratio:auto;height:46px;border-radius:12px}
.dot.u-ok{background:var(--accent)}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend .dot{width:8px;height:8px}
.day-list h3{font-size:14.5px;font-weight:700;color:var(--ink)}

/* avatars */
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:700;flex:none;position:relative;background:var(--surface-2);background:color-mix(in srgb,var(--avc) 16%,var(--surface));color:var(--avc)}
.av0{--avc:var(--av0)}.av1{--avc:var(--av1)}.av2{--avc:var(--av2)}.av3{--avc:var(--av3)}.av4{--avc:var(--av4)}.av5{--avc:var(--av5)}
.av.av-more{--avc:var(--ink-2)}

/* jobs: toolbar */
.jbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.search{position:relative;display:block;flex:0 1 300px;min-width:200px}
.search .s-ico{position:absolute;left:13px;top:0;bottom:0;display:flex;align-items:center;color:var(--ink-3);pointer-events:none}
.search input{padding-left:40px}
.jbar select.f{width:auto;min-width:150px;max-width:260px}
.jbar .grow{flex:1}
.chips{margin-bottom:16px}
.fchip{min-height:36px}
.list{grid-template-columns:repeat(auto-fill,minmax(540px,1fr));gap:12px}

/* jobs: board + detail panel */
.jobs-layout{display:flex;gap:16px;align-items:flex-start}
.board{flex:1 1 0;min-width:0;display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.board.has-collapsed{grid-template-columns:repeat(3,minmax(200px,1fr)) 56px}
.bcol{background:var(--surface-2);border-radius:14px;padding:12px;min-width:0}
.bcol.todo{--bar:var(--todo-bar)}.bcol.doing{--bar:var(--doing-bar)}.bcol.review{--bar:var(--review-bar)}.bcol.done{--bar:var(--done-bar)}
.bcol-h{display:flex;align-items:center;gap:8px;padding:2px 4px 12px}
.bcol-h h2{font-size:15.5px;font-weight:700;flex:1}
.bdot{display:block;width:10px;height:10px;border-radius:50%;background:var(--bar);flex:none}
.bcount{min-width:28px;height:24px;padding:0 6px;border-radius:12px;background:var(--surface);font-size:13px;font-weight:700;display:inline-grid;place-items:center;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bcol-body{display:flex;flex-direction:column;gap:10px}
.bempty{padding:20px 6px;text-align:center;font-size:13.5px;color:var(--ink-3)}
.kcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);color:inherit}
.kcard:hover{border-color:var(--accent)}
.kcard.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.kcard>span{display:block}
.k-top{display:flex!important;gap:8px;align-items:flex-start}
.k-title{flex:1;min-width:0;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.k-top .urg{margin:0;flex:none}
.k-proj{margin-top:4px;font-size:13px;color:var(--ink-3);line-height:1.4;overflow-wrap:anywhere}
.k-foot{display:flex!important;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:12px}
.k-due{display:block;font-size:13px;color:var(--ink-2)}
.k-cd{display:block;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.kcard.u-late .k-cd{color:var(--bad)}.kcard.u-soon .k-cd{color:var(--review)}.kcard.u-done .k-cd{color:var(--done)}
.bmore{width:100%;border:0;background:none;padding:8px 4px;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.bcol.collapsed{padding:0}
.bcol-collapsed{width:100%;border:0;background:transparent;padding:14px 0 16px;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--ink-2);border-radius:14px}
.bcol-collapsed:hover{background:var(--line)}
.bcol-collapsed .vt{writing-mode:vertical-rl;font-weight:700;font-size:14.5px;letter-spacing:.5px}
.dpanel{flex:0 0 380px;max-width:380px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px 22px;box-shadow:0 8px 24px rgba(16,24,40,.1);display:flex;flex-direction:column;gap:18px}
.dp-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dp-h>span{font-size:13.5px;font-weight:600;color:var(--ink-3)}
.dp-h .icon-btn{margin:-6px -8px -6px 0;width:40px;height:40px}
.dpanel h2{font-size:21px;line-height:1.35;margin-top:-6px;overflow-wrap:anywhere}
.dpanel h2:focus{outline:none}
.dpanel h2 .urg{margin-left:10px}
.dp-k{font-size:13.5px;color:var(--ink-3);margin-bottom:8px}
.dp-box{padding:10px 14px;border:1px solid var(--line);border-radius:11px;font-size:14.5px;line-height:1.45;overflow-wrap:anywhere;min-height:44px}
.dp-own{display:flex;align-items:center;gap:10px;padding:7px 12px}
.dp-row{display:flex;flex-wrap:wrap;gap:14px}
.dp-row>div{flex:1 1 150px;min-width:0}
.dp-cd{font-weight:600;color:var(--ink-2)}
.dp-box.u-late .dp-cd{color:var(--bad)}.dp-box.u-soon .dp-cd{color:var(--review)}.dp-box.u-done .dp-cd{color:var(--done)}
.dp-note{white-space:pre-wrap}
.dp-seg{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:12px}
.dp-seg button{flex:1;height:38px;border:0;border-radius:9px;background:transparent;font-size:14px;font-weight:500;color:var(--ink-2);padding:0 2px}
.dp-seg button:hover{color:var(--ink)}
.dp-seg button[aria-pressed="true"]{background:var(--surface);font-weight:700;box-shadow:0 1px 2px rgba(16,24,40,.16)}
.dp-seg button.todo[aria-pressed="true"]{color:var(--todo)}.dp-seg button.doing[aria-pressed="true"]{color:var(--doing)}.dp-seg button.review[aria-pressed="true"]{color:var(--review)}.dp-seg button.done[aria-pressed="true"]{color:var(--done)}
.dp-switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--surface-2);border-radius:11px}
.sw{width:48px;height:28px;border-radius:14px;border:0;background:var(--todo-bar);position:relative;flex:none;padding:0;transition:background .15s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw[aria-checked="true"]{background:var(--bad-solid)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.dp-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dp-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn.ghost-danger{border-color:transparent;background:transparent;color:var(--bad);font-weight:600}
.btn.ghost-danger:hover{background:var(--bad-bg)}

/* projects */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.proj{display:flex;flex-direction:column;gap:14px}
.proj .card-h{margin-bottom:0;align-items:flex-start}
.proj h2{font-size:18px;overflow-wrap:anywhere}
.proj-bar{display:grid;gap:10px}
.proj-stats{font-size:14px;color:var(--ink-2);margin:0;font-variant-numeric:tabular-nums}
.pnext{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:12px 14px;background:var(--surface-2);border:0;border-radius:11px;text-align:left;color:inherit;margin:0}
button.pnext:hover{background:var(--line)}
.pnext .k{display:block;font-size:12.5px;color:var(--ink-3)}
.pnext b{display:block;font-weight:600;overflow-wrap:anywhere}
.pnext .pn-d{display:grid;text-align:right;font-size:13.5px;color:var(--ink-2);white-space:nowrap;flex:none}
.pnext .cd{font-weight:600}
.pnext.u-late .cd{color:var(--bad)}.pnext.u-soon .cd{color:var(--review)}
.pnext.none{color:var(--ink-3);font-size:14px;justify-content:center}
.pmem{display:flex;align-items:center}
.pmem .av{width:30px;height:30px;margin-left:-6px;border:2px solid var(--surface)}
.pmem .av:first-child{margin-left:0}
.pmem-t{margin-left:10px;font-size:13.5px;color:var(--ink-3)}
.pfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}

.ulist{grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}

@media (max-width:1180px){
  .dpanel{flex-basis:340px;max-width:340px}
  .tiles.hero{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tile.big{grid-column:1/-1}
  .dash{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .app{display:block}
  .side{position:sticky;top:0;height:auto;overflow:visible;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px}
  .brand{padding:0}
  .mark{width:34px;height:34px}
  .brand-sub,.quick,.side-gap{display:none}
  #nav{order:3;flex:1 0 100%;flex-direction:row;overflow-x:auto;gap:4px}
  #nav a{padding:8px 12px;font-size:14px;gap:8px}
  .user{margin-left:auto;padding:2px 4px;background:transparent}
  .user-txt{display:none}
  .wrap{padding:16px 14px 64px}
  .page-head h1{font-size:24px}
  .jobs-layout{flex-direction:column;align-items:stretch}
  .board{width:100%;max-width:100%;flex:none}
  .dpanel{display:none}
  .board,.board.has-collapsed{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(250px,84%);scroll-snap-type:x mandatory}
  .bcol{scroll-snap-align:start}
  .list{grid-template-columns:minmax(0,1fr)}
  .pgrid,.ulist{grid-template-columns:minmax(0,1fr)}
  .search{flex:1 1 100%}
  .jbar select.f{flex:1 1 140px;max-width:none}
}
@media (max-width:640px){
  .tile,.tile.big{padding:14px 14px}
  .tile-num{font-size:34px}
