<body>
<div class="app">
  <aside class="side" aria-label="เมนูด้านข้าง">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l4 4 8-9"/></svg>
      </span>
      <div>
        <div class="brand-name">Project &amp; Jobs Tracker</div>
        <div class="brand-sub">ระบบจัดการโปรเจกต์และงานประจำวัน</div>
      </div>
    </div>
    <nav id="nav" aria-label="เมนูหลัก"></nav>
    <div class="quick" id="quick"></div>
    <div class="side-gap"></div>
    <div class="user" id="userBox"></div>
  </aside>
  <div class="content">
    <div id="banner" role="status"></div>
    <main class="wrap" id="main"><p class="loading">กำลังโหลดข้อมูล…</p></main>
  </div>
</div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="tip" role="tooltip" hidden></div>

<script>
(function () {
  'use strict';

  /* ---------- constants ---------- */
  var STATUS = [
    { key: 'รอทำ', cls: 'todo' },
    { key: 'กำลังทำ', cls: 'doing' },
    { key: 'รอตรวจ', cls: 'review' },
    { key: 'เสร็จ', cls: 'done' }
  ];
  var STATUS_CLS = {};
  STATUS.forEach(function (s) { STATUS_CLS[s.key] = s.cls; });
  var DONE = 'เสร็จ';
  var URGENT = 'ด่วน';
  var DIFF = ['ง่าย', 'ปานกลาง', 'ยาก', 'ยากมาก'];
  var MON_S = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  var MON_L = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  var DOW = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
  var VIEWS = ['dashboard', 'jobs', 'projects', 'users'];

  var ICON = {
    plus: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>',
    edit: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 13.5l.7-3L11 2.7a1.4 1.4 0 012 2L5.2 12.8l-2.7.7z"/></svg>',
    trash: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5M7 7v4M9 7v4"/></svg>',
    out: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2.5H3.5A1.5 1.5 0 002 4v8a1.5 1.5 0 001.5 1.5H6M10 5l3 3-3 3M13 8H6"/></svg>',
    left: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>',
    right: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>',
    check: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>'
  };

  /* ---------- extra icons, avatars, saved view mode ---------- */
  function svgI(d, size, sw) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || 1.9) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + d + '"/></svg>';
  }
  var NAVICON = {
    dashboard: 'M3 3h7v9H3z M14 3h7v5h-7z M14 12h7v9h-7z M3 16h7v5H3z',
    jobs: 'M11 6h10 M11 12h10 M11 18h10 M3 6l1.5 1.5L7 5 M3 12l1.5 1.5L7 11 M3 18l1.5 1.5L7 17',
    projects: 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
    users: 'M16 20v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1 M9.5 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z M21 20v-1a4 4 0 0 0-3-3.9 M16 4.1a3.5 3.5 0 0 1 0 6.8'
  };
  ICON.search = svgI('M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z M21 21l-4.3-4.3', 18, 2);
  ICON.close = svgI('M6 6l12 12 M18 6L6 18', 20, 2);
  var MARK = '<svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5l4 4 8-9"/></svg>';
  var MODE_KEY = 'tracker_mode_v1';
  function readMode() { try { var m = localStorage.getItem(MODE_KEY); return m === 'list' || m === 'board' ? m : ''; } catch (e) { return ''; } }
  function saveMode() { try { localStorage.setItem(MODE_KEY, ui.mode); } catch (e) { /* storage blocked */ } }
  function isNarrow() { return window.matchMedia('(max-width: 900px)').matches; }
  function avIdx(name) { var h = 0, s = String(name || ''); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h % 6; }
  function avatar(name) {
    var n = String(name || '').trim();
    return '<span class="av av' + avIdx(n) + '" title="' + esc(n || 'ยังไม่ระบุ') + '">' + esc(n ? n.charAt(0).toUpperCase() : '?') + '<span class="sr"> ผู้รับผิดชอบ: ' + esc(n || 'ยังไม่ระบุ') + '</span></span>';
  }
  function lockBrand() {
    return '<div class="lock-brand"><span class="mark" aria-hidden="true">' + MARK + '</span><div><div class="brand-name">Project &amp; Jobs Tracker</div><div class="brand-sub">ระบบจัดการโปรเจกต์และงานประจำวัน</div></div></div>';
  }

  /* ---------- state ---------- */
  var API_URL = 'https://script.google.com/macros/s/AKfycbyz-SEZ7Ns68-a0Z1O6RXXlkQyzT_h1iD6bc1ZakZJ_Mvoivwi1Sw0kJ9tojSv65gUM/exec'; // Google Apps Script web app address (ends with /exec)
  var POLL_MS = 15000;
  var OLD_PIN_KEY = 'tracker_pin_v1';   // earlier single-PIN version, removed on start
  var TOK_KEY = 'tracker_tok_v2';
  var USER_KEY = 'tracker_user_v2';
  var token = '';
  var me = null;           // { id, username, name, role }
  var users = [];          // admin: everyone, member: only me
  var maxUsers = 5;
  var auth = 'checking';   // 'checking' | 'setup' | 'login' | 'ok'
  var lockError = '';
  var syncError = '';
  var writeSeq = 0;        // changes on every local write
  var writing = 0;         // writes in flight
  var refreshing = false;
  var lastSig = '';
  var jobs = [];
  var projects = [];
  var ui = { view: 'dashboard', status: 'all', project: 'all', owner: 'all', q: '', sort: 'deadline', calY: 0, calM: 0, day: '', showDone: false, more: false, mode: 'board', sel: '', doneOpen: false, expand: {}, scope: 'all' };
  var lastTick = null;     // for the undo button after ticking a job
  var lastFocus = null;
  var pendingConfirm = null;
  var toastTimer = null;

  /* ---------- helpers ---------- */
  function $(s) { return document.querySelector(s); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseYmd(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function today() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function daysLeft(s) {
    var d = parseYmd(s);
    return d ? Math.round((d - today()) / 86400000) : null;
  }
  function fmtDate(s) {
    var d = parseYmd(s);
    return d ? d.getDate() + ' ' + MON_S[d.getMonth()] + ' ' + d.getFullYear() : 'ไม่ระบุ';
  }
  function splitList(s) {
    return String(s || '').split(/[,،、]/).map(function (x) { return x.trim(); }).filter(Boolean);
  }
  function isAdmin() { return !!me && me.role === 'admin'; }
  function canEditProject(p) { return isAdmin() || (!!me && p.ownerId === me.id); }
  function userById(id) { for (var i = 0; i < users.length; i++) if (users[i].id === id) return users[i]; return null; }
  function activeUsers() { return users.filter(function (u) { return u.active === 'yes'; }); }
  function fmtStamp(iso) {
    var d = new Date(iso);
    if (!iso || isNaN(d.getTime())) return '';
    return d.getDate() + ' ' + MON_S[d.getMonth()] + ' ' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function isOpen(j) { return j.status !== DONE; }
  function isUrgent(j) { var u = String(j.urgent == null ? '' : j.urgent).trim(); return u !== '' && u !== '0'; }
  function urgBadge(j) { return isUrgent(j) && isOpen(j) ? '<span class="urg">ด่วน</span>' : ''; }
  function isLate(j) { var d = daysLeft(j.deadline); return isOpen(j) && d !== null && d < 0; }
  function countdown(j) {
    if (j.status === DONE) return 'เสร็จแล้ว';
    var d = daysLeft(j.deadline);
    if (d === null) return 'ไม่ระบุกำหนด';
    if (d < 0) return 'เกินกำหนด ' + (-d) + ' วัน';
    if (d === 0) return 'ครบกำหนดวันนี้';
    if (d === 1) return 'พรุ่งนี้';
    return 'อีก ' + d + ' วัน';
  }
  function urgency(j) {
    if (j.status === DONE) return 'done';
    var d = daysLeft(j.deadline);
    if (d === null) return 'ok';
    if (d < 0) return 'late';
    if (d <= 3) return 'soon';
    if (d <= 7) return 'week';
    return 'ok';
  }
  function projById(id) {
    for (var i = 0; i < projects.length; i++) if (projects[i].id === id) return projects[i];
    return null;
  }
  function projName(id) { var p = projById(id); return p ? p.name : ''; }
  function byDeadline(a, b) {
    return (a.deadline || '9999-99-99').localeCompare(b.deadline || '9999-99-99');
  }
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  /* ---------- Google Apps Script API ---------- */
  function readTok() { try { return localStorage.getItem(TOK_KEY) || ''; } catch (e) { return ''; } }
  function saveTok(t) {
    try { if (t) localStorage.setItem(TOK_KEY, t); else localStorage.removeItem(TOK_KEY); } catch (e) { /* storage blocked */ }
  }
  function readUserHint() { try { return localStorage.getItem(USER_KEY) || ''; } catch (e) { return ''; } }
  function saveUserHint(u) { try { if (u) localStorage.setItem(USER_KEY, u); } catch (e) { /* storage blocked */ } }

  async function api(action, payload) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, 25000);
    try {
      var res = await fetch(API_URL, {
        method: 'POST',
        // text/plain keeps this a simple request, so the browser sends no preflight
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action: action, token: token }, payload || {})),
        redirect: 'follow',
        signal: ctl.signal
      });
      var data = await res.json();
      if (!data || !data.ok) {
        var er = new Error((data && data.error) || 'bad_response');
        er.code = (data && data.error) || 'bad_response';
        throw er;
      }
      return data;
    } finally { clearTimeout(timer); }
  }

  var ERR = {
    bad_login: 'ชื่อผู้ใช้หรือ PIN ไม่ถูกต้อง',
    bad_pin: 'PIN เดิมไม่ถูกต้อง',
    locked: 'ใส่ผิดหลายครั้ง ลองใหม่ใน 10 นาที',
    bad_token: 'หมดเวลาเข้าสู่ระบบ ให้เข้าสู่ระบบใหม่',
    forbidden: 'ไม่มีสิทธิ์ทำรายการนี้',
    not_found: 'ไม่พบรายการนี้ (อาจถูกลบไปแล้ว)',
    already_setup: 'ตั้งค่าครั้งแรกเสร็จแล้ว ให้เข้าสู่ระบบแทน',
    bad_setup_key: 'รหัสตั้งค่าไม่ถูกต้อง',
    no_setup_key: 'ในสคริปต์ยังไม่มีรหัสตั้งค่า',
    max_users: 'มีผู้ใช้ที่เปิดใช้งานครบ ' + 5 + ' คนแล้ว ปิดใช้งานคนอื่นก่อน',
    username_taken: 'ชื่อผู้ใช้นี้มีอยู่แล้ว',
    bad_username: 'ชื่อผู้ใช้ใช้ได้เฉพาะ a-z ตัวเลข . _ - ยาว 2–24 ตัว',
    bad_name: 'ใส่ชื่อที่แสดง (ไม่เกิน 60 ตัวอักษร)',
    weak_pin: 'PIN ต้องยาวอย่างน้อย 6 ตัว',
    last_admin: 'ต้องมีผู้ดูแลระบบที่ใช้งานอยู่อย่างน้อย 1 คน',
    bad_owner: 'ผู้รับผิดชอบที่เลือกไม่ถูกต้อง',
    bad_project: 'โปรเจกต์ที่เลือกไม่ถูกต้อง'
  };
  function errText(e) {
    var c = e && (e.code || e.name);
    if (ERR[c]) return ERR[c];
    if (c === 'AbortError') return 'เชื่อมต่อช้าเกินไป';
    if (c === 'TypeError') return 'ติดต่อ Google ไม่ได้ ตรวจอินเทอร์เน็ตหรือลิงก์ Web App';
    return (e && e.message) || 'ไม่ทราบสาเหตุ';
  }

  // Ask the script whether this is a first run (no admin yet) or a normal sign-in.
  async function loadMode() {
    auth = 'checking'; syncError = '';
    render();
    try {
      var d = await api('status');
      auth = d.mode === 'setup' ? 'setup' : 'login';
    } catch (e) { syncError = errText(e); }
    render();
  }

  function clearSession() {
    token = ''; saveTok('');
    me = null; users = []; jobs = []; projects = []; lastSig = '';
    closeModal();
  }

  function toLogin(msg) {
    clearSession();
    lockError = msg || '';
    loadMode();
  }

  async function logout() {
    var t = token;
    if (t) { try { await api('logout'); } catch (e) { /* the token expires on its own */ } }
    toLogin('');
  }

  function signedIn(res, username) {
    token = res.token; saveTok(token);
    me = res.me; saveUserHint(username || res.me.username);
    users = [res.me]; jobs = []; projects = []; lastSig = '';
    lockError = ''; syncError = '';
    auth = 'checking';
    render();
    refresh();
  }

  function upsertLocal(arr, row) {
    for (var i = 0; i < arr.length; i++) if (arr[i].id === row.id) { arr[i] = row; return; }
    arr.push(row);
  }

  async function safe(fn, okMsg) {
    writing++; writeSeq++;
    try { await fn(); if (okMsg) toast(okMsg); return true; }
    catch (e) {
      console.error(e);
      if (e && e.code === 'bad_token') toLogin(ERR.bad_token);
      else toast('บันทึกไม่สำเร็จ: ' + errText(e));
      return false;
    } finally {
      writing--; writeSeq++;
      lastSig = '';          // next refresh always redraws from the sheet
      render();
      refresh();
    }
  }

  async function refresh() {
    if (refreshing || writing > 0 || !token) return;
    refreshing = true;
    var seq = writeSeq;
    try {
      var data = await api('list');
      if (seq === writeSeq && writing === 0) {
        var sig = JSON.stringify([data.jobs, data.projects, data.users, data.me]);
        var changed = sig !== lastSig || auth !== 'ok' || !!syncError;
        jobs = data.jobs; projects = data.projects; users = data.users; me = data.me;
        maxUsers = data.maxUsers || 5; lastSig = sig;
        auth = 'ok'; syncError = '';
        if (changed) render();
      }
    } catch (e) {
      if (e && e.code === 'bad_token') toLogin(auth === 'ok' ? ERR.bad_token : '');
      else { syncError = errText(e); render(); }
    } finally { refreshing = false; }
  }

  /* ---------- render ---------- */
  function lateCount() { return jobs.filter(isLate).length; }

  function isWeek(j) { var d = daysLeft(j.deadline); return isOpen(j) && d !== null && d >= 0 && d <= 7; }

  function renderNav() {
    if (auth !== 'ok') { $('#nav').innerHTML = ''; return; }
    var late = lateCount();
    var items = [['dashboard', 'ภาพรวม'], ['jobs', 'งาน'], ['projects', 'โปรเจกต์']];
    if (isAdmin()) items.push(['users', 'ผู้ใช้']);
    $('#nav').innerHTML = items.map(function (it) {
      var badge = it[0] === 'jobs' && late ? '<span class="badge" title="งานเกินกำหนด">' + late + '</span>' : '';
      return '<a href="#' + it[0] + '"' + (ui.view === it[0] ? ' aria-current="page"' : '') + '>' + svgI(NAVICON[it[0]], 20, 1.9) + '<span class="nv-t">' + it[1] + '</span>' + badge + '</a>';
    }).join('');
  }

  function renderQuick() {
    var q = $('#quick');
    if (!q) return;
    if (auth !== 'ok') { q.innerHTML = ''; return; }
    var open = jobs.filter(isOpen);
    var items = [
      ['late', 'เกินกำหนด', jobs.filter(isLate).length, '#F97066'],
      ['week', 'ครบใน 7 วัน', jobs.filter(isWeek).length, '#FDB022'],
      ['urgent', 'งานด่วน', open.filter(isUrgent).length, '#B692F6'],
      ['กำลังทำ', 'กำลังทำ', jobs.filter(function (j) { return j.status === 'กำลังทำ'; }).length, '#7FA2F5'],
      ['รอตรวจ', 'รอตรวจ', jobs.filter(function (j) { return j.status === 'รอตรวจ'; }).length, '#47CD89']
    ];
    q.innerHTML = '<div class="quick-h">มุมมองด่วน</div>' + items.map(function (it) {
      var on = ui.view === 'jobs' && ui.status === it[0];
      return '<button type="button" class="qv" data-action="go-status" data-status="' + it[0] + '"' + (on ? ' aria-current="true"' : '') + '>' +
        '<i class="qd" style="background:' + it[3] + '"></i><span>' + it[1] + '</span><span class="qn">' + it[2] + '</span></button>';
    }).join('');
  }

  function renderBanner() {
    var msg = '';
    if (API_URL.indexOf('PUT_') === 0) msg = 'ยังไม่ได้ตั้งค่าลิงก์ Web App ใน index.html (ตัวแปร API_URL)';
    else if (syncError && auth === 'ok') msg = 'เชื่อมต่อ Google Sheet ไม่ได้ (' + syncError + ') กำลังลองใหม่ ข้อมูลที่เห็นอาจไม่ใช่ล่าสุด';
    $('#banner').textContent = msg;
  }

  function loginHTML() {
    return '<div class="card lock">' + lockBrand() + '<h1>เข้าสู่ระบบ</h1><p class="sub">ใส่ชื่อผู้ใช้และ PIN ที่ผู้ดูแลระบบให้ไว้</p>' +
      '<form id="loginForm" novalidate>' +
      '<div class="field"><label for="lg-user">ชื่อผู้ใช้</label><input type="text" id="lg-user" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="40" value="' + esc(readUserHint()) + '"></div>' +
      '<div class="field"><label for="lg-pin">PIN</label><input type="password" id="lg-pin" autocomplete="current-password" maxlength="64"></div>' +
      '<div class="err" id="lg-err" role="alert">' + esc(lockError) + '</div>' +
      '<div class="actions"><button type="submit" class="btn primary" id="lg-btn">เข้าสู่ระบบ</button></div></form></div>';
  }

  function setupHTML() {
    return '<div class="card lock wide">' + lockBrand() + '<h1>ตั้งค่าครั้งแรก</h1>' +
      '<p class="sub">สร้างบัญชีผู้ดูแลระบบ (Admin) ของคุณ แล้วค่อยเพิ่มผู้ใช้คนอื่นได้ในเมนู "ผู้ใช้"</p>' +
      '<form id="setupForm" novalidate>' +
      '<div class="field"><label for="su-key">รหัสตั้งค่า</label><input type="password" id="su-key" autocomplete="off" maxlength="64"><div class="hint">ใส่ PIN เดิมที่เคยใช้เข้าระบบ เพื่อยืนยันว่าเป็นเจ้าของระบบ</div></div>' +
      '<div class="two">' +
        '<div class="field"><label for="su-user">ชื่อผู้ใช้</label><input type="text" id="su-user" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="24" placeholder="เช่น nattira"><div class="hint">a-z ตัวเลข . _ - ใช้ตอนเข้าสู่ระบบ</div></div>' +
        '<div class="field"><label for="su-name">ชื่อที่แสดง</label><input type="text" id="su-name" autocomplete="name" maxlength="60" placeholder="เช่น Nattira Tharator"></div>' +
      '</div>' +
      '<div class="two">' +
        '<div class="field"><label for="su-pin">PIN ใหม่ของคุณ</label><input type="password" id="su-pin" autocomplete="new-password" maxlength="64"><div class="hint">อย่างน้อย 6 ตัว</div></div>' +
        '<div class="field"><label for="su-pin2">ยืนยัน PIN</label><input type="password" id="su-pin2" autocomplete="new-password" maxlength="64"></div>' +
      '</div>' +
      '<div class="err" id="su-err" role="alert"></div>' +
      '<div class="actions"><button type="submit" class="btn primary" id="su-btn">สร้างบัญชีผู้ดูแลระบบ</button></div></form></div>';
  }

  function checkingHTML() {
    if (syncError) {
      return '<div class="card empty"><p>เชื่อมต่อ Google Sheet ไม่ได้: ' + esc(syncError) + '</p>' +
        '<div class="actions" style="justify-content:center"><button type="button" class="btn primary" data-action="retry">ลองใหม่</button>' +
        (token ? '<button type="button" class="btn" data-action="logout">ออกจากระบบ</button>' : '') + '</div></div>';
    }
    return '<p class="loading">กำลังโหลดข้อมูล…</p>';
  }

  function renderUser() {
    var box = $('#userBox');
    if (!box) return;
    if (auth !== 'ok' || !me) { box.innerHTML = ''; return; }
    box.innerHTML = '<button type="button" class="user-btn" data-action="account" aria-label="บัญชีของฉัน" title="บัญชีของฉัน">' +
      '<span class="avatar" aria-hidden="true">' + esc(String(me.name || '?').trim().charAt(0).toUpperCase()) + '</span>' +
      '<div class="user-txt"><div class="user-name">' + esc(me.name) + '</div><div class="user-role">' + (isAdmin() ? 'Admin' : 'สมาชิก') + '</div></div></button>' +
      '<button type="button" class="icon-btn" data-action="logout" aria-label="ออกจากระบบ" title="ออกจากระบบ">' + ICON.out + '</button>';
  }

  function render() {
    hideTip();
    var keep = document.activeElement;
    var kid = keep && keep.id && keep.closest('#main') ? keep.id : '';
    var ss = kid ? keep.selectionStart : null;
    var se = kid ? keep.selectionEnd : null;

    if (ui.view === 'users' && auth === 'ok' && !isAdmin()) ui.view = 'dashboard';
    renderNav();
    renderUser();
    renderQuick();
    renderBanner();
    document.body.classList.toggle('is-locked', auth !== 'ok');
    var keepForm = (auth === 'login' && document.getElementById('loginForm')) || (auth === 'setup' && document.getElementById('setupForm'));
    if (!keepForm || syncError) {
      $('#main').innerHTML = auth === 'login' ? loginHTML()
        : auth === 'setup' ? setupHTML()
        : auth !== 'ok' ? checkingHTML()
        : ui.view === 'jobs' ? viewJobs() : ui.view === 'projects' ? viewProjects() : ui.view === 'users' ? viewUsers() : viewDashboard();
    }

    if (!kid && (auth === 'login' || auth === 'setup') && !modalOpen()) {
      var fi = document.getElementById(auth === 'login' ? (readUserHint() ? 'lg-pin' : 'lg-user') : 'su-key');
      if (fi) fi.focus();
    }
    if (kid) {
      var el = document.getElementById(kid);
      if (el) {
        el.focus();
        try { if (ss != null) el.setSelectionRange(ss, se); } catch (e) { /* not a text input */ }
      }
    }
  }

  /* ----- shared pieces ----- */
  function statusSelect(j) {
    var cls = STATUS_CLS[j.status] || 'todo';
    return '<span class="selwrap ' + cls + '"><select class="st" data-action="status" data-id="' + esc(j.id) + '" aria-label="สถานะของงาน ' + esc(j.title) + '">' +
      STATUS.map(function (s) { return '<option' + (s.key === j.status ? ' selected' : '') + '>' + s.key + '</option>'; }).join('') +
      '</select></span>';
  }
  function diffBars(j) {
    var idx = DIFF.indexOf(j.difficulty);
    var lv = idx >= 0 ? idx + 1 : 0;
    var bars = '';
    for (var i = 1; i <= 4; i++) bars += '<i class="' + (i <= lv ? 'on' : '') + '"></i>';
    return '<span class="diff" title="ความยาก: ' + esc(j.difficulty || 'ไม่ระบุ') + '">' + bars + '<span>' + esc(j.difficulty || '') + '</span></span>';
  }
  function miniRow(j) {
    var p = projName(j.projectId);
    return '<button type="button" class="mini u-' + urgency(j) + '" data-action="edit-job" data-id="' + esc(j.id) + '">' +
      '<span class="mini-t"><b>' + esc(j.title) + urgBadge(j) + '</b><span>' + esc(p || 'ไม่มีโปรเจกต์') + ' · ' + esc(j.owner || 'ยังไม่ระบุผู้รับผิดชอบ') + '</span></span>' +
      '<span class="due">' + fmtDate(j.deadline) + '<br>' + countdown(j) + '</span></button>';
  }

  /* ----- dashboard ----- */
  function todoRank(j) {
    var d = daysLeft(j.deadline);
    if (d !== null && d < 0) return 0;      // overdue first
    if (isUrgent(j)) return 1;               // then urgent
    return d === null ? 3 : 2;               // then by date; no date last
  }
  function byTodo(a, b) { return todoRank(a) - todoRank(b) || byDeadline(a, b); }
  function todoRow(j) {
    var done = j.status === DONE;
    var meta = (done ? '' : '<b class="pill ' + (STATUS_CLS[j.status] || 'todo') + '">' + esc(j.status) + '</b> ') + esc(projName(j.projectId) || 'ไม่มีโปรเจกต์') + ' · ' + esc(j.owner || 'ยังไม่ระบุผู้รับผิดชอบ');
    return '<li class="trow u-' + urgency(j) + (done ? ' is-done' : '') + '">' +
      '<button type="button" class="tick" role="checkbox" aria-checked="' + done + '" data-action="tick" data-id="' + esc(j.id) + '" aria-label="' + (done ? 'เปิดงานนี้อีกครั้ง: ' : 'ทำเสร็จแล้ว: ') + esc(j.title) + '">' + (done ? ICON.check : '') + '</button>' +
      '<button type="button" class="todo-main" data-action="edit-job" data-id="' + esc(j.id) + '"><span class="todo-t">' + esc(j.title) + urgBadge(j) + '</span><span class="todo-s">' + meta + '</span></button>' +
      '<span class="todo-due">' + (j.deadline ? '<span>' + fmtDate(j.deadline) + '</span>' : '') + '<span class="cd">' + countdown(j) + '</span></span></li>';
  }
  function setDone(j, toDone) {
    var prev = { id: j.id, status: j.status, doneAt: j.doneAt || '' };
    var v = toDone ? DONE : 'กำลังทำ';
    var at = toDone ? new Date().toISOString() : '';
    j.status = v; j.doneAt = at;
    render();   // show it at once; a failed save redraws from the sheet
    safe(function () { return api('patch', { table: 'jobs', id: j.id, fields: { status: v, doneAt: at } }); }).then(function (ok) {
      if (ok) { lastTick = prev; toastUndo((toDone ? 'ทำเสร็จแล้ว: ' : 'เปิดงานอีกครั้งแล้ว: ') + j.title); }
    });
  }
  function undoTick() {
    var p = lastTick; lastTick = null;
    if (!p) return;
    var j = findJob(p.id);
    if (!j) return;
    $('#toast').classList.remove('show', 'act');
    j.status = p.status; j.doneAt = p.doneAt;
    render();
    safe(function () { return api('patch', { table: 'jobs', id: p.id, fields: { status: p.status, doneAt: p.doneAt } }); }, 'ยกเลิกแล้ว');
  }
  function toastUndo(msg) {
    var t = $('#toast');
    t.innerHTML = '<span>' + esc(msg) + '</span><button type="button" class="undo" data-action="undo-tick">ยกเลิก</button>';
    t.classList.add('show', 'act');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show', 'act'); }, 7000);
  }

  /* ----- dashboard ----- */
  function viewDashboard() {
    var now = today();
    var dateStr = now.getDate() + ' ' + MON_L[now.getMonth()] + ' ' + now.getFullYear();
    var head = '<div class="page-head"><div><h1>ภาพรวม</h1><p class="sub">วันนี้ ' + dateStr + (isAdmin() ? ' · งานของทุกคน' : ' · เฉพาะงานของคุณ') + '</p></div>' +
      '<button type="button" class="btn primary" data-action="add">' + ICON.plus + 'เพิ่ม</button></div>';

    if (!jobs.length) {
      return head + '<div class="card empty"><p>ยังไม่มีงานในระบบ</p><button type="button" class="btn primary" data-action="add">' + ICON.plus + 'เพิ่มรายการแรก</button></div>';
    }

    var counts = {};
    STATUS.forEach(function (s) { counts[s.key] = 0; });
    jobs.forEach(function (j) { if (counts[j.status] != null) counts[j.status]++; });
    var lateJobs = jobs.filter(isLate);
    var nLate = lateJobs.length;
    var oldest = 0;
    lateJobs.forEach(function (j) { var d = -daysLeft(j.deadline); if (d > oldest) oldest = d; });
    var wk = jobs.filter(isWeek);
    var w0 = wk.filter(function (j) { return daysLeft(j.deadline) === 0; }).length;
    var w1 = wk.filter(function (j) { return daysLeft(j.deadline) === 1; }).length;
    var wsub = wk.length
      ? [w0 ? 'วันนี้ ' + w0 : '', w1 ? 'พรุ่งนี้ ' + w1 : '', wk.length - w0 - w1 ? 'อีก 2–7 วัน ' + (wk.length - w0 - w1) : ''].filter(Boolean).join(' · ')
      : 'ไม่มีงานครบใน 7 วัน';
    var urgJobs = jobs.filter(function (j) { return isUrgent(j) && isOpen(j); });
    var urgLate = urgJobs.filter(isLate).length;
    var done = counts[DONE];
    var pct = Math.round(done / jobs.length * 100);

    var seg = STATUS.map(function (s) {
      return counts[s.key] ? '<i style="flex:' + counts[s.key] + ' 1 0;background:var(--' + s.cls + '-bar)"></i>' : '';
    }).join('');
    var legend = STATUS.map(function (s) {
      return '<span><i style="background:var(--' + s.cls + '-bar)"></i>' + s.key + ' ' + counts[s.key] + '</span>';
    }).join('');
    function tile(cls, status, ico, color, bg, label, num, sub) {
      return '<button type="button" class="tile ' + cls + '" style="--ci:' + color + ';--ci-bg:' + bg + '" data-action="go-status" data-status="' + status + '">' +
        '<span class="tile-h"><span class="tile-ico">' + svgI(ico, 19, 2) + '</span><span class="tile-label">' + label + '</span></span>' +
        '<span class="tile-num">' + num + '</span><span class="tile-sub">' + sub + '</span></button>';
    }
    var tiles = '<div class="tiles hero">' +
      '<button type="button" class="tile big" data-action="go-status" data-status="all">' +
        '<span class="tile-label">งานทั้งหมด</span>' +
        '<span class="tile-numrow"><span class="tile-num">' + jobs.length + '</span><span class="tile-sub">เสร็จแล้ว ' + done + ' จาก ' + jobs.length + ' งาน (' + pct + '%)</span></span>' +
        '<span class="stackbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '" aria-label="ความคืบหน้ารวม เสร็จ ' + pct + '%">' + seg + '</span>' +
        '<span class="legend2">' + legend + '</span></button>' +
      tile('is-late' + (nLate ? ' is-alert' : ''), 'late', 'M12 9v4 M12 17h.01 M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z', 'var(--bad)', 'var(--bad-bg)', 'เกินกำหนด', nLate, nLate ? 'เก่าสุดเกิน ' + oldest + ' วัน' : 'ไม่มีงานเกินกำหนด') +
      tile('is-week' + (wk.length ? ' is-warn' : ''), 'week', 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M12 7v5l3 2', 'var(--review)', 'var(--review-bg)', 'ครบใน 7 วัน', wk.length, wsub) +
      tile('is-urgent' + (urgJobs.length ? ' is-info' : ''), 'urgent', 'M4 22V4 M4 4h12l-2 4 2 4H4', 'var(--doing)', 'var(--doing-bg)', 'งานด่วน', urgJobs.length, urgJobs.length ? (urgLate ? 'เกินกำหนดแล้ว ' + urgLate + ' งาน' : 'ยังไม่เกินกำหนด') : 'ไม่มีงานด่วน') +
      '</div>';

    var scope = isAdmin() ? ui.scope : 'all';
    var open = jobs.filter(isOpen).filter(function (j) { return scope !== 'mine' || (me && j.ownerId === me.id); }).sort(byTodo);
    var LIMIT = 6;
    var listHtml = open.length
      ? '<ul class="todos">' + open.slice(0, LIMIT).map(todoRow).join('') + '</ul>' +
        (open.length > LIMIT ? '<p class="card-note">แสดง ' + LIMIT + ' จาก ' + open.length + ' งานที่ยังไม่เสร็จ</p>' : '')
      : '<p class="empty">' + (scope === 'mine' ? 'ไม่มีงานค้างของคุณ' : 'ไม่มีงานค้าง ทุกงานเสร็จแล้ว') + '</p>';

    var doneJobs = jobs.filter(function (j) { return !isOpen(j); }).sort(function (a, b) { return String(b.doneAt || '').localeCompare(String(a.doneAt || '')); });
    var doneHtml = '';
    if (doneJobs.length) {
      doneHtml = '<button type="button" class="linkbtn" data-action="toggle-done" aria-expanded="' + ui.showDone + '">เสร็จแล้ว ' + doneJobs.length + ' งาน · ' + (ui.showDone ? 'ซ่อน' : 'ดู') + '</button>' +
        (ui.showDone ? '<ul class="todos" style="margin-top:10px">' + doneJobs.slice(0, 5).map(todoRow).join('') + '</ul>' +
          (doneJobs.length > 5 ? '<p class="card-note">แสดง 5 งานที่เสร็จล่าสุด · ดูทั้งหมดในหน้างาน</p>' : '') : '');
    }
    var scopeSw = isAdmin()
      ? '<div class="segs" role="group" aria-label="ขอบเขตงาน">' +
          '<button type="button" data-action="todo-scope" data-scope="all" aria-pressed="' + (scope !== 'mine') + '">ทุกคน</button>' +
          '<button type="button" data-action="todo-scope" data-scope="mine" aria-pressed="' + (scope === 'mine') + '">ของฉัน</button></div>'
      : '';

    return head + tiles +
      '<div class="dash"><section class="card" aria-labelledby="upT"><div class="head-tools"><div><h2 id="upT" style="font-size:19px;font-weight:700">ต้องทำก่อน</h2>' +
      '<p class="card-sub">เรียงจากเกินกำหนด → ด่วน → ใกล้ครบกำหนด · ติ๊กวงกลมเมื่อทำเสร็จ</p></div>' + scopeSw + '</div>' +
      listHtml + doneHtml +
      '<p class="card-sub" style="margin-top:12px"><a class="linkbtn" style="padding:0" href="#jobs">ดูงานทั้งหมดบนกระดาน</a></p></section>' +
      '<section class="card" aria-labelledby="calT">' + calendarHTML() + '</section></div>' + chartsHTML();
  }

  /* ----- charts ----- */
  function chartCard(id, title, sub, body, link) {
    return '<section class="card" aria-labelledby="' + id + '"><div class="card-h"><h2 id="' + id + '">' + title + '</h2>' + (link || '') + '</div>' +
      (sub ? '<p class="chart-sub">' + sub + '</p>' : '') + body + '</section>';
  }
  function dayMon(d) { return d.getDate() + ' ' + MON_S[d.getMonth()]; }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }

  /* one horizontal bar row; segs = [{n, color, opacity}] */
  function hrow(name, segs, max, tip) {
    var total = segs.reduce(function (a, s) { return a + s.n; }, 0);
    var w = max && total ? Math.max(total / max * 100, 3) : 0;
    var fill = segs.filter(function (s) { return s.n > 0; }).map(function (s) {
      return '<i class="hseg" style="flex:' + s.n + ' 1 0;background:' + s.color + (s.opacity ? ';opacity:' + s.opacity : '') + '"></i>';
    }).join('');
    return '<div class="hrow" tabindex="0" role="img" data-tip="' + esc(tip) + '" aria-label="' + esc(tip) + '">' +
      '<span class="nm">' + esc(name) + '</span>' +
      '<span class="htrack"><span class="hfill" style="width:' + w + '%">' + fill + '</span></span>' +
      '<span class="val">' + total + '</span></div>';
  }

  function weeklyChart() {
    var t0 = today();
    var s0 = addDays(t0, -t0.getDay());           // Sunday of this week, same as the calendar
    var NB = 8;                                   // late | this week | 5 more weeks | later
    var b = [], i;
    for (i = 0; i < NB; i++) b.push(0);
    var open = 0, nodate = 0;
    jobs.forEach(function (j) {
      if (!isOpen(j)) return;
      var d = parseYmd(j.deadline);
      if (!d) { nodate++; return; }
      open++;
      if (d < t0) { b[0]++; return; }
      var k = Math.floor(Math.round((d - s0) / 86400000) / 7);
      b[Math.min(k + 1, NB - 1)]++;
    });
    var sub = 'งานที่ยังไม่เสร็จ นับตามวันกำหนดส่ง';
    if (!open) {
      return chartCard('chWeek', 'กำหนดส่งรายสัปดาห์', sub,
        '<p class="chart-empty">ไม่มีงานค้างที่ระบุกำหนดส่ง</p>' + (nodate ? '<p class="chart-foot">ไม่ระบุกำหนดส่ง ' + nodate + ' งาน</p>' : ''));
    }
    var H = 110, max = Math.max.apply(null, b);
    var cols = '', labs = '';
    b.forEach(function (n, idx) {
      var tip, lab, color = 'var(--c-open)';
      if (idx === 0) { tip = 'เกินกำหนดแล้ว: ' + n + ' งาน'; lab = '<span class="x-late">เกิน</span>'; color = 'var(--bad-bar)'; }
      else if (idx === 1) { tip = 'สัปดาห์นี้ (ถึง ' + dayMon(addDays(s0, 6)) + '): ' + n + ' งาน'; lab = '<span>นี้</span>'; }
      else if (idx === NB - 1) { tip = 'ตั้งแต่ ' + dayMon(addDays(s0, 42)) + ' เป็นต้นไป: ' + n + ' งาน'; lab = '<span>ถัดไป</span>'; }
      else {
        var ws = addDays(s0, 7 * (idx - 1));
        tip = 'สัปดาห์ ' + dayMon(ws) + ' – ' + dayMon(addDays(ws, 6)) + ': ' + n + ' งาน';
        lab = '<span>' + ws.getDate() + '<br>' + MON_S[ws.getMonth()] + '</span>';
      }
      var h = n ? Math.max(4, Math.round(n / max * H)) : 0;
      cols += '<div class="col" tabindex="0" role="img" data-tip="' + esc(tip) + '" aria-label="' + esc(tip) + '">' +
        '<span class="col-v' + (n ? '' : ' zero') + '">' + n + '</span>' +
        (n ? '<span class="col-bar" style="height:' + h + 'px;background:' + color + '"></span>' : '') + '</div>';
      labs += lab;
    });
    return chartCard('chWeek', 'กำหนดส่งรายสัปดาห์', sub,
      '<div class="cols">' + cols + '</div><div class="xlabs" aria-hidden="true">' + labs + '</div>' +
      (nodate ? '<p class="chart-foot">ไม่ระบุกำหนดส่ง ' + nodate + ' งาน (ไม่แสดงในกราฟ)</p>' : ''));
  }

  function ownerChart() {
    var map = {}, rows = [];
    jobs.forEach(function (j) {
      var k = String(j.owner || '').trim() || 'ไม่ระบุ';
      if (!map[k]) { map[k] = { name: k, open: 0, done: 0, late: 0 }; rows.push(map[k]); }
      if (j.status === DONE) map[k].done++;
      else { map[k].open++; if (isLate(j)) map[k].late++; }
    });
    rows.sort(function (a, b) { return (b.open + b.done) - (a.open + a.done) || b.open - a.open; });
    var MAXR = 7;
    if (rows.length > MAXR + 1) {
      var rest = rows.slice(MAXR), o = { name: 'อื่นๆ (' + rest.length + ' คน)', open: 0, done: 0, late: 0 };
      rest.forEach(function (r) { o.open += r.open; o.done += r.done; o.late += r.late; });
      rows = rows.slice(0, MAXR).concat([o]);
    }
    var max = Math.max.apply(null, rows.map(function (r) { return r.open + r.done; }));
    var legend = '<div class="legend"><span><i style="background:var(--c-open)"></i>ยังไม่เสร็จ</span><span><i style="background:var(--c-done)"></i>เสร็จ</span></div>';
    var html = rows.map(function (r) {
      var tip = r.name + ': ยังไม่เสร็จ ' + r.open + ' · เสร็จ ' + r.done + (r.late ? ' · เกินกำหนด ' + r.late : '');
      return hrow(r.name, [{ n: r.open, color: 'var(--c-open)' }, { n: r.done, color: 'var(--c-done)' }], max, tip);
    }).join('');
    return chartCard('chOwner', 'งานตามผู้รับผิดชอบ', 'จำนวนงานทั้งหมดของแต่ละคน', legend + '<div class="hbars">' + html + '</div>');
  }

  function diffChart() {
    var open = jobs.filter(isOpen);
    var sub = 'งานที่ยังไม่เสร็จ แยกตามระดับความยาก';
    if (!open.length) return chartCard('chDiff', 'ความยากของงานที่ค้าง', sub, '<p class="chart-empty">ไม่มีงานค้าง</p>');
    var counts = DIFF.map(function () { return 0; }), none = 0;
    open.forEach(function (j) { var i = DIFF.indexOf(j.difficulty); if (i < 0) none++; else counts[i]++; });
    var max = Math.max.apply(null, counts.concat([none]));
    var ops = [0.45, 0.65, 0.85, 1];
    var html = DIFF.map(function (d, i) {
      return hrow(d, [{ n: counts[i], color: 'var(--c-open)', opacity: ops[i] }], max, d + ': ' + counts[i] + ' งาน');
    }).join('');
    if (none) html += hrow('ไม่ระบุ', [{ n: none, color: 'var(--todo-bar)' }], max, 'ไม่ระบุความยาก: ' + none + ' งาน');
    return chartCard('chDiff', 'ความยากของงานที่ค้าง', sub, '<div class="hbars">' + html + '</div>');
  }

  function projectChart() {
    var byId = {};
    projects.forEach(function (p) { byId[p.id] = { name: p.name, done: 0, total: 0 }; });
    var none = { name: 'ไม่ได้อยู่ในโปรเจกต์', done: 0, total: 0 };
    jobs.forEach(function (j) {
      var g = byId[j.projectId] || none;
      g.total++;
      if (j.status === DONE) g.done++;
    });
    var rows = projects.map(function (p) { return byId[p.id]; }).filter(function (g) { return g.total > 0; });
    if (none.total) rows.push(none);
    rows.sort(function (a, b) { return (b.total - b.done) - (a.total - a.done); });
    var link = '<a class="muted" href="#projects">ดูทั้งหมด</a>';
    var sub = 'งานที่เสร็จแล้วเทียบกับงานทั้งหมด';
    if (!rows.length) return chartCard('chProj', 'ความคืบหน้าตามโปรเจกต์', sub, '<p class="chart-empty">ยังไม่มีโปรเจกต์</p>', link);
    var extra = rows.length > 6 ? rows.length - 6 : 0;
    var html = rows.slice(0, 6).map(function (g) {
      var pct = Math.round(g.done / g.total * 100);
      var tip = g.name + ': เสร็จ ' + g.done + ' จาก ' + g.total + ' งาน (' + pct + '%)';
      return '<div class="prow" tabindex="0" role="img" data-tip="' + esc(tip) + '" aria-label="' + esc(tip) + '">' +
        '<div class="prow-h"><span class="nm">' + esc(g.name) + '</span><span class="val">' + g.done + '/' + g.total + ' · ' + pct + '%</span></div>' +
        '<div class="prog"><span style="width:' + pct + '%"></span></div></div>';
    }).join('');
    return chartCard('chProj', 'ความคืบหน้าตามโปรเจกต์', sub,
      '<div class="hbars">' + html + '</div>' + (extra ? '<p class="chart-foot">และอีก ' + extra + ' โปรเจกต์</p>' : ''), link);
  }

  function chartsHTML() {
    var main = weeklyChart() + projectChart() + (isAdmin() ? ownerChart() : diffChart());
    var extra = isAdmin() ? diffChart() : '';
    return '<div class="charts c3">' + main + '</div>' +
      (extra ? '<button type="button" class="linkbtn" data-action="toggle-more" aria-expanded="' + ui.more + '">' + (ui.more ? 'ซ่อนกราฟเพิ่มเติม' : 'ดูกราฟเพิ่มเติม') + '</button>' +
        (ui.more ? '<div class="charts" style="margin-top:12px">' + extra + '</div>' : '') : '');
  }

  /* hover / focus tooltip shared by every chart mark */
  function tipTarget(n) { return n && n.closest ? n.closest('[data-tip]') : null; }
  function showTip(el) {
    var t = $('#tip');
    if (!t || !el) return;
    t.textContent = el.getAttribute('data-tip') || '';
    t.hidden = false;
    var r = el.getBoundingClientRect();
    var w = t.offsetWidth, h = t.offsetHeight;
    var x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), window.innerWidth - w - 8);
    var y = r.top - h - 8;
    if (y < 8) y = r.bottom + 8;
    t.style.left = x + 'px';
    t.style.top = y + 'px';
  }
  function hideTip() { var t = $('#tip'); if (t) t.hidden = true; }

  function calendarHTML() {
    var y = ui.calY, m = ui.calM;
    var first = new Date(y, m, 1).getDay();
    var dim = new Date(y, m + 1, 0).getDate();
    var byDay = {};
    jobs.forEach(function (j) { if (j.deadline) (byDay[j.deadline] = byDay[j.deadline] || []).push(j); });
    var t = ymd(today());
    var cells = '';
    var i, d;
    for (i = 0; i < first; i++) cells += '<span></span>';
    for (d = 1; d <= dim; d++) {
      var key = y + '-' + pad(m + 1) + '-' + pad(d);
      var list = byDay[key] || [];
      var dots = list.slice(0, 3).map(function (j) { return '<i class="dot u-' + urgency(j) + '"></i>'; }).join('');
      cells += '<button type="button" class="day' + (key === t ? ' today' : '') + (key === ui.day ? ' sel' : '') + '" data-action="pick-day" data-day="' + key + '"' +
        ' aria-pressed="' + (key === ui.day) + '" aria-label="' + d + ' ' + MON_L[m] + ' ' + y + (list.length ? ', ' + list.length + ' งานครบกำหนด' : '') + '">' +
        '<span>' + d + '</span><span class="dots">' + dots + '</span></button>';
    }
    var dow = DOW.map(function (n) { return '<div class="dow">' + n + '</div>'; }).join('');

    var sel = ui.day ? (byDay[ui.day] || []).slice().sort(function (a, b) { return (a.status === DONE) - (b.status === DONE); }) : [];

    return '<div class="card-h"><h2 id="calT">ปฏิทินกำหนดส่ง</h2><div class="cal-nav">' +
      '<button type="button" class="icon-btn" data-action="cal-prev" aria-label="เดือนก่อนหน้า">' + ICON.left + '</button>' +
      '<span class="cal-title">' + MON_L[m] + ' ' + y + '</span>' +
      '<button type="button" class="icon-btn" data-action="cal-next" aria-label="เดือนถัดไป">' + ICON.right + '</button></div></div>' +
      '<div class="cal-grid">' + dow + cells + '</div>' +
      '<div class="cal-legend"><span><i class="dot u-late"></i>เกินกำหนด</span><span><i class="dot u-soon"></i>ใกล้ครบ</span><span><i class="dot u-ok"></i>ยังไม่ถึง</span><span><i class="dot u-done"></i>เสร็จแล้ว</span></div>' +
      '<div class="day-list"><h3>' + esc(selTitle) + (sel.length ? ' · ' + sel.length + ' งาน' : '') + '</h3>' + selHtml + '</div>';
  }

  /* ----- jobs ----- */
  function filteredJobs() {
    var q = ui.q.trim().toLowerCase();
    var l = jobs.filter(function (j) {
      if (ui.status === 'late') { if (!isLate(j)) return false; }
      else if (ui.status === 'urgent') { if (!(isUrgent(j) && isOpen(j))) return false; }
      else if (ui.status === 'week') { if (!isWeek(j)) return false; }
      else if (ui.status !== 'all' && j.status !== ui.status) return false;
      if (ui.owner !== 'all' && j.ownerId !== ui.owner) return false;
      if (ui.project !== 'all') {
        var pid = j.projectId || '';
        if (ui.project === 'none' ? pid !== '' : pid !== ui.project) return false;
      }
      if (q) {
        var hay = [j.title, j.owner, j.collaborators, j.note, projName(j.projectId), isUrgent(j) ? URGENT : ''].join(' ').toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
    l.sort(function (a, b) {
      if (ui.sort === 'difficulty') return (DIFF.indexOf(b.difficulty) - DIFF.indexOf(a.difficulty)) || byDeadline(a, b);
      if (ui.sort === 'new') return String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
      return ((a.status === DONE) - (b.status === DONE)) || byDeadline(a, b);
    });
    return l;
  }

  function boardHTML(list) {
    var selJob = ui.sel ? findJob(ui.sel) : null;
    var collapse = !!selJob && !ui.doneOpen && selJob.status !== DONE;
    var html = STATUS.map(function (s) {
      var items = list.filter(function (j) { return j.status === s.key; });
      var isDone = s.key === DONE;
      if (isDone) items.sort(function (a, b) { return String(b.doneAt || '').localeCompare(String(a.doneAt || '')); });
      else items.sort(function (a, b) { return (isUrgent(b) - isUrgent(a)) || byDeadline(a, b); });
      if (isDone && collapse) {
        return '<section class="bcol collapsed done" aria-label="เสร็จ"><button type="button" class="bcol-collapsed" data-action="open-done" aria-label="แสดงคอลัมน์เสร็จ (' + items.length + ' งาน)">' +
          '<span class="bcount">' + items.length + '</span><span class="vt">เสร็จ</span><i class="bdot"></i></button></section>';
      }
      var cap = isDone ? 6 : 12;
      var all = !!ui.expand[s.key];
      var shown = all ? items : items.slice(0, cap);
      var more = items.length - shown.length;
      return '<section class="bcol ' + s.cls + '" aria-label="' + s.key + '"><div class="bcol-h"><i class="bdot"></i><h2>' + s.key + '</h2><span class="bcount">' + items.length + '</span></div><div class="bcol-body">' +
        (shown.length ? shown.map(kcard).join('') : '<p class="bempty">ไม่มีงาน</p>') +
        (more > 0 ? '<button type="button" class="bmore" data-action="expand-col" data-status="' + s.key + '">แสดงอีก ' + more + ' งาน</button>' : '') +
        (all && items.length > cap ? '<button type="button" class="bmore" data-action="expand-col" data-status="' + s.key + '">แสดงน้อยลง</button>' : '') +
        '</div></section>';
    }).join('');
    return '<div class="board' + (collapse ? ' has-collapsed' : '') + '">' + html + '</div>';
  }

        '<div><div class="dp-k">ผู้ร่วมงาน</div><div class="dp-box">' + (collabs.length ? collabs.map(chipHTML).join(' ') : '–') + '</div></div></div>' +
      '<div class="dp-row"><div><div class="dp-k">กำหนดส่ง</div><div class="dp-box u-' + u + '">' + (j.deadline ? '<div>' + fmtDate(j.deadline) + '</div>' : '') + '<div class="dp-cd">' + countdown(j) + '</div></div></div>' +
        '<div><div class="dp-k">ความยาก</div><div class="dp-box">' + diffBars(j) + '</div></div></div>' +

    var projOpts = '<option value="all"' + (ui.project === 'all' ? ' selected' : '') + '>ทุกโปรเจกต์</option>' +

      projects.slice().sort(function (a, b) { return String(a.name).localeCompare(String(b.name), 'th'); }).map(function (p) {

        users.map(function (u) { return '<option value="' + esc(u.id) + '"' + (ui.owner === u.id ? ' selected' : '') + '>' + esc(u.name) + (u.active === 'yes' ? '' : ' (ปิดใช้งาน)') + '</option>'; }).join('') + '</select>';

      sortSel = '<select class="f" id="sortSel" aria-label="เรียงลำดับ">' + sortOpts + '</select>';

      body = '<div class="card empty"><p>ยังไม่มีงานในระบบ</p><button type="button" class="btn primary" data-action="add-job">' + ICON.plus + 'เพิ่มงานแรก</button></div>';

  function focusSel(sel) { var el = document.querySelector(sel); if (el) el.focus(); }
  function changeStatus(j, v) {
    if (!j || j.status === v) return;
    var doneAt = v === DONE ? new Date().toISOString() : '';
    j.status = v; j.doneAt = doneAt;
    render();   // show the change at once; a failed save redraws from the sheet
    safe(function () {
      return api('patch', { table: 'jobs', id: j.id, fields: { status: v, doneAt: doneAt } });
    }, 'เปลี่ยนสถานะเป็น "' + v + '" แล้ว');
  }
  function setUrgent(j, on) {
    if (!j || isUrgent(j) === on) return;
    var v = on ? URGENT : '';

  /* ----- projects ----- */
  function countBy(list) {
    var c = {};
    STATUS.forEach(function (s) { c[s.key] = 0; });
    list.forEach(function (j) { if (c[j.status] != null) c[j.status]++; });
    return c;
  }
  function stackBar(counts, label) {
    var total = STATUS.reduce(function (a, s) { return a + counts[s.key]; }, 0);
    var seg = total
      ? STATUS.map(function (s) { return counts[s.key] ? '<i style="flex:' + counts[s.key] + ' 1 0;background:var(--' + s.cls + '-bar)"></i>' : ''; }).join('')
      : '<i style="flex:1;background:var(--line)"></i>';
    return '<span class="stackbar" role="img" aria-label="' + esc(label) + '">' + seg + '</span>';
  }
  function statusLegend(counts) {
    return '<span class="legend2">' + STATUS.map(function (s) { return '<span><i style="background:var(--' + s.cls + '-bar)"></i>' + s.key + ' ' + counts[s.key] + '</span>'; }).join('') + '</span>';
  }
  function memberAvatars(list) {
    var names = [];
    list.forEach(function (j) { var n = String(j.owner || '').trim(); if (n && names.indexOf(n) < 0) names.push(n); });
    if (!names.length) return '';
    return '<div class="pmem">' + names.slice(0, 4).map(avatar).join('') +
      (names.length > 4 ? '<span class="av av-more">+' + (names.length - 4) + '</span>' : '') +
      '<span class="pmem-t">' + names.length + ' คนที่เกี่ยวข้อง</span></div>';

  function nextBlock(pj) {
    if (!pj.length) return '<p class="pnext none">ยังไม่มีงานในโปรเจกต์นี้</p>';

  function projectCard(p) {
    var pj = jobs.filter(function (j) { return j.projectId === p.id; }).sort(byDeadline);
    var counts = countBy(pj);
    var done = counts[DONE];
    var pct = pj.length ? Math.round(done / pj.length * 100) : 0;
    var stats = pj.length ? 'เสร็จ ' + done + ' จาก ' + pj.length + ' งาน · ' + pct + '%' : 'ยังไม่มีงานในโปรเจกต์นี้';
    return '<section class="card proj"><div class="card-h"><div style="min-width:0"><h2>' + esc(p.name) + '</h2>' + (p.note ? '<p class="note">' + esc(p.note) + '</p>' : '') + '</div>' +
      (canEditProject(p)
        ? '<div class="job-actions"><button type="button" class="icon-btn" data-action="edit-project" data-id="' + esc(p.id) + '" aria-label="แก้ไขโปรเจกต์ ' + esc(p.name) + '">' + ICON.edit + '</button>' +
          '<button type="button" class="icon-btn del" data-action="del-project" data-id="' + esc(p.id) + '" aria-label="ลบโปรเจกต์ ' + esc(p.name) + '">' + ICON.trash + '</button></div>'

  async function submitUser(form) {
    var id = form.getAttribute('data-id');
    var err = $('#u-err');
    var name = $('#u-name').value.trim(), username = $('#u-user').value.trim().toLowerCase(), pinv = $('#u-pin').value;
    err.textContent = '';
    if (!name) { err.textContent = ERR.bad_name; $('#u-name').focus(); return; }
    if (!/^[a-z0-9._-]{2,24}$/.test(username)) { err.textContent = ERR.bad_username; $('#u-user').focus(); return; }
    if ((!id || pinv) && pinv.trim().length < 6) { err.textContent = ERR.weak_pin; $('#u-pin').focus(); return; }
    var roleEl = form.querySelector('input[name="role"]:checked');
    var payload = { id: id || undefined, name: name, username: username, role: roleEl ? roleEl.value : 'member' };
    if (pinv) payload.pin = pinv;
    var act = $('#u-active');
    if (id && act && !act.disabled) payload.active = act.checked;
    var btn = $('#saveBtn'); btn.disabled = true;
    try {
      var res = await api('userSave', payload);
      users = res.users;
      var mine = userById(me.id); if (mine) me = mine;
      lastSig = '';
      closeModal(); toast(id ? 'บันทึกผู้ใช้แล้ว' : 'เพิ่มผู้ใช้แล้ว');
      render(); refresh();
    } catch (e) {
      if (e && e.code === 'bad_token') { toLogin(ERR.bad_token); return; }
      err.textContent = errText(e); btn.disabled = false;
    }
  }

        '<div class="two">' +
          ownerField +
          '<div class="field"><label for="f-collab">ผู้ร่วมงาน</label><input type="text" id="f-collab" list="dl-names" value="' + esc(j.collaborators) + '" maxlength="160" placeholder="เช่น PD"><div class="hint">คั่นหลายคนด้วยเครื่องหมายจุลภาค ใช้เป็นป้ายชื่อเท่านั้น ไม่ให้สิทธิ์ดูงาน</div></div>' +
        '</div>' +
        '<datalist id="dl-names">' + names.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>' +
        '<div class="two">' +
          '<div class="field"><label for="f-deadline">กำหนดส่ง <span class="req">*</span></label><input type="date" id="f-deadline" value="' + esc(j.deadline) + '"><div class="err" id="e-deadline" aria-live="polite"></div></div>' +
          '<div class="field"><label for="f-status">สถานะ</label><select class="f" id="f-status">' + optionList(STATUS.map(function (s) { return s.key; }), j.status) + '</select></div>' +
        '</div>' +
        '<div class="field" role="radiogroup" aria-labelledby="l-diff"><span class="lbl" id="l-diff">ความยาก</span><div class="seg">' + seg + '</div></div>' +
        '<div class="field"><label for="f-note">หมายเหตุ</label><textarea id="f-note" maxlength="1000">' + esc(j.note) + '</textarea></div>' + stamp +
        '<div class="actions"><button type="button" class="btn" data-action="close-modal">ยกเลิก</button><button type="submit" class="btn primary" id="saveBtn">บันทึก</button></div>' +
      '</form>');
  }

  async function submitJob(form) {
    var title = $('#f-title').value.trim();
    var deadline = $('#f-deadline').value;
    $('#e-title').textContent = title ? '' : 'ใส่ชื่องานก่อนบันทึก';
    $('#e-deadline').textContent = parseYmd(deadline) ? '' : 'เลือกวันที่กำหนดส่ง';
    if (!title) { $('#f-title').focus(); return; }
    if (!parseYmd(deadline)) { $('#f-deadline').focus(); return; }

    var id = form.getAttribute('data-id');
    var existing = null;
    for (var i = 0; i < jobs.length; i++) if (jobs[i].id === id) existing = jobs[i];
    var diffEl = form.querySelector('input[name="diff"]:checked');
    var status = $('#f-status').value;
    var data = {
      title: title,
      projectId: $('#f-project').value,
      collaborators: $('#f-collab').value.trim(),
      deadline: deadline,
      difficulty: diffEl ? diffEl.value : 'ปานกลาง',
      status: status,
      note: $('#f-note').value.trim(),
      urgent: (form.querySelector('input[name="urg"]:checked') || {}).value || '',
      doneAt: status === DONE ? ((existing && existing.doneAt) || new Date().toISOString()) : ''
    };
    if (isAdmin()) data.ownerId = $('#f-owner').value;
    var btn = $('#saveBtn'); btn.disabled = true;
    var ok = await safe(async function () {
      var res = await api('upsert', { table: 'jobs', row: id ? Object.assign({ id: id }, data) : data });
      upsertLocal(jobs, res.row);
    }, 'บันทึกงานแล้ว');
    if (ok) closeModal(); else btn.disabled = false;
  }

  function openProjectModal(p) {
    var x = p || { name: '', note: '' };
    openModal('<h2 id="mT">' + (p ? 'แก้ไขโปรเจกต์' : 'เพิ่มโปรเจกต์ใหม่') + '</h2>' +
      '<form id="projForm" data-id="' + esc(p ? p.id : '') + '" novalidate>' +
        '<div class="field"><label for="p-name">ชื่อโปรเจกต์ <span class="req">*</span></label><input type="text" id="p-name" data-first value="' + esc(x.name) + '" maxlength="200" placeholder="เช่น ติดตั้งสายแลนและคอมพิวเตอร์ Line QC ZN"><div class="err" id="e-pname" aria-live="polite"></div></div>' +
        '<div class="field"><label for="p-note">รายละเอียด</label><textarea id="p-note" maxlength="1000">' + esc(x.note) + '</textarea></div>' +
        '<p class="hint" style="margin:-4px 0 14px">โปรเจกต์คือกลุ่มของงานย่อย บันทึกแล้วเพิ่มงานเข้าโปรเจกต์ได้ที่ปุ่ม "เพิ่มงานในโปรเจกต์นี้" ในหน้าโปรเจกต์</p>' +
        '<div class="actions"><button type="button" class="btn" data-action="close-modal">ยกเลิก</button><button type="submit" class="btn primary" id="saveBtn">บันทึก</button></div>' +
      '</form>');
  }

  async function submitProject(form) {
    var name = $('#p-name').value.trim();
    $('#e-pname').textContent = name ? '' : 'ใส่ชื่อโปรเจกต์ก่อนบันทึก';
    if (!name) { $('#p-name').focus(); return; }
    var id = form.getAttribute('data-id');
    var existing = projById(id);
    var data = { name: name, note: $('#p-note').value.trim() };
    var btn = $('#saveBtn'); btn.disabled = true;
    var ok = await safe(async function () {
      var res = await api('upsert', { table: 'projects', row: id ? Object.assign({ id: id }, data) : data });
      upsertLocal(projects, res.row);
    }, 'บันทึกโปรเจกต์แล้ว');
    if (ok) closeModal(); else btn.disabled = false;
  }

  function openConfirm(title, body, okLabel, onOk) {
    pendingConfirm = onOk;
    openModal('<h2 id="mT">' + esc(title) + '</h2><p style="margin-bottom:18px;color:var(--ink-2)">' + esc(body) + '</p>' +
      '<div class="actions"><button type="button" class="btn" data-action="close-modal" data-first>ยกเลิก</button><button type="button" class="btn danger" data-action="confirm-ok">' + esc(okLabel) + '</button></div>');
  }

  /* ---------- sign-in ---------- */
  async function doLogin() {
    var err = $('#lg-err'), btn = $('#lg-btn');
    var u = $('#lg-user').value.trim(), p = $('#lg-pin').value;
    lockError = '';
    if (!u || !p) { err.textContent = 'ใส่ชื่อผู้ใช้และ PIN ก่อน'; return; }
    err.textContent = ''; btn.disabled = true;
    try {
      var res = await api('login', { username: u, pin: p });
      signedIn(res, u.toLowerCase());
    } catch (e) {
      err.textContent = errText(e); btn.disabled = false;
      $('#lg-pin').value = ''; $('#lg-pin').focus();
    }
  }

  async function doSetup() {
    var err = $('#su-err'), btn = $('#su-btn');
    var key = $('#su-key').value, u = $('#su-user').value.trim().toLowerCase(), nm = $('#su-name').value.trim();
    var p = $('#su-pin').value, p2 = $('#su-pin2').value;
    err.textContent = '';
    if (!key) { err.textContent = 'ใส่รหัสตั้งค่า (PIN เดิม) ก่อน'; $('#su-key').focus(); return; }
    if (!/^[a-z0-9._-]{2,24}$/.test(u)) { err.textContent = ERR.bad_username; $('#su-user').focus(); return; }
    if (!nm) { err.textContent = ERR.bad_name; $('#su-name').focus(); return; }
    if (p.trim().length < 6) { err.textContent = ERR.weak_pin; $('#su-pin').focus(); return; }
    if (p !== p2) { err.textContent = 'PIN ใหม่ทั้งสองช่องไม่ตรงกัน'; $('#su-pin2').focus(); return; }
    btn.disabled = true;
    try {
      var res = await api('setup', { key: key, username: u, name: nm, pin: p });
      signedIn(res, u);
      toast('สร้างบัญชีผู้ดูแลระบบแล้ว');
    } catch (e) {
      if (e && e.code === 'already_setup') { lockError = ERR.already_setup; loadMode(); return; }
      err.textContent = errText(e); btn.disabled = false;
    }
  }

  /* ---------- events ---------- */
  function findJob(id) { for (var i = 0; i < jobs.length; i++) if (jobs[i].id === id) return jobs[i]; return null; }

  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t.classList && t.classList.contains('overlay')) { closeModal(); return; }
    var el = t.closest ? t.closest('[data-action]') : null;
    if (!el || el.tagName === 'SELECT') return;
    var a = el.getAttribute('data-action');
    var id = el.getAttribute('data-id');

    if (a === 'go-status') {
      var gs = el.getAttribute('data-status');
      ui.status = gs; ui.project = 'all'; ui.owner = 'all'; ui.q = '';
      if (STATUS_CLS[gs]) ui.mode = 'list';     // one status = a plain list (not saved as the preferred view)
      location.hash = 'jobs'; if (ui.view === 'jobs') render();
    }
    else if (a === 'filter-status') { ui.status = el.getAttribute('data-status'); render(); }
    else if (a === 'clear-filters') { ui.status = 'all'; ui.project = 'all'; ui.owner = 'all'; ui.q = ''; render(); }
    else if (a === 'add') openTypeChooser();
    else if (a === 'add-job') openJobModal(null, el.getAttribute('data-project') || '', el.getAttribute('data-urgent') === '1');
    else if (a === 'edit-job') { var j = findJob(id); if (j) openJobModal(j); }
    else if (a === 'del-job') {
      var dj = findJob(id);
      if (dj) openConfirm('ลบงานนี้?', 'งาน "' + dj.title + '" จะถูกลบถาวร', 'ลบงาน', async function () {
        var ok = await safe(async function () {
          await api('remove', { table: 'jobs', id: id });
          jobs = jobs.filter(function (x) { return x.id !== id; });
        }, 'ลบงานแล้ว');
        if (ok) closeModal();
      });
    }
    else if (a === 'add-project') openProjectModal(null);
    else if (a === 'edit-project') { var p = projById(id); if (p) openProjectModal(p); }
    else if (a === 'del-project') {
      var dp = projById(id);
      if (dp) {
        var inside = jobs.filter(function (x) { return x.projectId === id; });
        var msg = inside.length
          ? 'โปรเจกต์ "' + dp.name + '" มี ' + inside.length + ' งาน งานจะยังอยู่แต่ไม่มีโปรเจกต์'
          : 'โปรเจกต์ "' + dp.name + '" จะถูกลบถาวร';
        openConfirm('ลบโปรเจกต์นี้?', msg, 'ลบโปรเจกต์', async function () {
          var ok = await safe(async function () {
            await api('deleteProject', { id: id });
            projects = projects.filter(function (x) { return x.id !== id; });
            jobs.forEach(function (x) { if (x.projectId === id) x.projectId = ''; });
          }, 'ลบโปรเจกต์แล้ว');
          if (ok) closeModal();
        });
      }
    }
    else if (a === 'confirm-ok') { var fn = pendingConfirm; if (fn) { el.disabled = true; fn(); } }
    else if (a === 'close-modal') closeModal();
    else if (a === 'retry') { syncError = ''; if (token) { auth = 'checking'; render(); refresh(); } else loadMode(); }
    else if (a === 'logout') logout();
    else if (a === 'account') openAccountModal();
    else if (a === 'add-user') { if (isAdmin()) openUserModal(null); }
    else if (a === 'edit-user') { var eu = userById(id); if (eu && isAdmin()) openUserModal(eu); }
    else if (a === 'tick') { var tj = findJob(id); if (tj) setDone(tj, tj.status !== DONE); }
    else if (a === 'undo-tick') undoTick();
    else if (a === 'toggle-done') { ui.showDone = !ui.showDone; render(); }
    else if (a === 'toggle-more') { ui.more = !ui.more; render(); }
    else if (a === 'open-job') {
      var oj = findJob(id);
      if (oj) { if (isNarrow()) openJobModal(oj); else { ui.sel = id; render(); focusSel('#dpT'); } }
    }
    else if (a === 'close-panel') closePanel();
    else if (a === 'open-done') { ui.doneOpen = true; render(); }
    else if (a === 'expand-col') { var ek = el.getAttribute('data-status'); ui.expand[ek] = !ui.expand[ek]; render(); }
    else if (a === 'set-status') changeStatus(findJob(id), el.getAttribute('data-status'));
    else if (a === 'toggle-urgent') { var uj = findJob(id); if (uj) setUrgent(uj, !isUrgent(uj)); }
    else if (a === 'set-mode') {
      ui.mode = el.getAttribute('data-mode') === 'list' ? 'list' : 'board';
      if (ui.mode === 'board' && STATUS_CLS[ui.status]) ui.status = 'all';
      saveMode(); render();
    }
    else if (a === 'todo-scope') { ui.scope = el.getAttribute('data-scope') === 'mine' ? 'mine' : 'all'; render(); }
    else if (a === 'open-project-jobs') { ui.project = id; ui.status = 'all'; ui.owner = 'all'; ui.q = ''; location.hash = 'jobs'; if (ui.view === 'jobs') render(); }
    else if (a === 'pick-day') { ui.day = el.getAttribute('data-day'); render(); }
    else if (a === 'cal-prev') { ui.calM--; if (ui.calM < 0) { ui.calM = 11; ui.calY--; } render(); }
    else if (a === 'cal-next') { ui.calM++; if (ui.calM > 11) { ui.calM = 0; ui.calY++; } render(); }
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.getAttribute && el.getAttribute('data-action') === 'status') {
      changeStatus(findJob(el.getAttribute('data-id')), el.value);
    } else if (el.id === 'projSel') { ui.project = el.value; render(); }
    else if (el.id === 'ownerSel') { ui.owner = el.value; render(); }
    else if (el.id === 'sortSel') { ui.sort = el.value; render(); }
  });

  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') { ui.q = e.target.value; render(); }
  });

  document.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'loginForm') doLogin();
    else if (e.target.id === 'setupForm') doSetup();
    else if (e.target.id === 'userForm') submitUser(e.target);
    else if (e.target.id === 'pinForm') submitPin();
    else if (e.target.id === 'jobForm') submitJob(e.target);
    else if (e.target.id === 'projForm') submitProject(e.target);
  });

  document.addEventListener('keydown', function (e) {
    if (!modalOpen()) {
      if (e.key === 'Escape' && ui.sel && ui.view === 'jobs' && auth === 'ok') closePanel();
      return;
    }
    if (e.key === 'Escape') { closeModal(); return; }
    if (e.key === 'Tab') {
      var f = $('#modal').querySelectorAll('input:not([type=radio]),select,textarea,button:not([disabled]),input[type=radio]:checked');
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  function route() {
    var h = location.hash.replace('#', '');
    ui.view = VIEWS.indexOf(h) >= 0 ? h : 'dashboard';
    render();
  }
  document.addEventListener('pointerover', function (e) { var el = tipTarget(e.target); if (el) showTip(el); });
  document.addEventListener('pointerout', function (e) { if (tipTarget(e.target)) hideTip(); });
  document.addEventListener('focusin', function (e) { var el = tipTarget(e.target); if (el) showTip(el); });
  document.addEventListener('focusout', function (e) { if (tipTarget(e.target)) hideTip(); });
  document.addEventListener('pointerdown', function (e) { if (!tipTarget(e.target)) hideTip(); });
  window.addEventListener('scroll', hideTip, true);
  window.addEventListener('resize', hideTip);
  window.addEventListener('hashchange', route);

  /* ---------- start ---------- */
  function init() {
    var n = today();
    ui.calY = n.getFullYear(); ui.calM = n.getMonth(); ui.day = ymd(n);
    ui.mode = readMode() || (isNarrow() ? 'list' : 'board');
    try { localStorage.removeItem(OLD_PIN_KEY); } catch (e) { /* storage blocked */ }
    token = readTok();
    route();
    if (token) refresh(); else loadMode();
    setInterval(function () { if (auth === 'ok' && !document.hidden) refresh(); }, POLL_MS);
    document.addEventListener('visibilitychange', function () { if (!document.hidden && auth === 'ok') refresh(); });
  }
  init();
})();
</script>
</body>
</html>
